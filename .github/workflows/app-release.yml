name: App release

# The desktop app's releases. Push a tag `v<semver>`:
#   v1.0.5           a stable release, published as the repository's latest release
#   v1.1.0-beta.1    a beta: a pre-release, and the rolling `app-beta` release updated
# A stable build's in-app updater reads the latest release (`releases/latest/download/`); a beta
# build reads `app-beta`, whose files this workflow replaces, so testers on a beta are offered the
# next beta (see gui/electron-builder.config.cjs). See gui/DISTRIBUTION.md.
#
# Run by hand (Actions → App release → Run workflow) on a branch, it is a test build: every
# platform is built and signed as for a release, the installers are kept as the run's artifacts,
# and nothing is published. Run by hand on main with "release" ticked, it releases pyproject.toml's
# version as a stable release, as a pushed tag would: the tag `v<version>` is made only once every
# build and test has passed (D319), so a phone is enough to release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: "Release pyproject.toml's version (run on main)"
        type: boolean
        default: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.ref_type == 'tag' || inputs.release

      - id: v
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$RELEASE" = true ]; then
            # A release started by hand: main's pyproject.toml version, tagged later by `release`.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release runs on main; this run is on $GITHUB_REF_NAME"
              exit 1
            fi
            TAG="v$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG already exists; bump pyproject.toml's version first"
              exit 1
            fi
          else
            # A test build: a version no release will use, on the beta channel.
            echo "version=0.0.0-beta.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG is not v<major>.<minor>.<patch>[-beta.<n>]"
            exit 1
          fi
          CHANNEL=stable
          [[ "$VERSION" == *-* ]] && CHANNEL=beta
          # Settings → About shows the engine's version from pyproject.toml beside the app's, so a
          # stable release carries one number in both.
          PROJECT=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$CHANNEL" = stable ] && [ "$PROJECT" != "$VERSION" ]; then
            echo "::error::pyproject.toml's version is $PROJECT; bump it to $VERSION before tagging $TAG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: ./.github/actions/run-tests

  app:
    # Built, and signed where the secrets exist, on each platform from the same tag. It runs
    # alongside `test` rather than after it: nothing is published until `release`, which waits
    # for both. The two Mac architectures build in separate jobs so their notarizations, each
    # about three minutes of waiting on Apple, run at once; `release` merges their update feeds.
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
            arch: arm64
          - os: macos-latest
            dist: dist:mac
            arch: x64
          - os: windows-latest
            dist: dist:win
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # A step's `if:` can't read secrets, so whether signing is configured is decided here.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_PUBLISHER_NAME != '' }}
      WATCHDOG_RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
      # The Mac architecture this job builds (electron-builder.config.cjs); empty elsewhere.
      WATCHDOG_MAC_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        working-directory: gui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Set the app version from the tag
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:unit

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          # The Developer ID G2 intermediate CA, so the certificate chain is valid
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o $RUNNER_TEMP/DeveloperIDG2CA.cer
          security import $RUNNER_TEMP/DeveloperIDG2CA.cer -k $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH

      - name: Install Azure Artifact Signing module (Windows)
        if: runner.os == 'Windows' && env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        run: Install-Module -Name TrustedSigning -Force -AllowClobber -Scope CurrentUser

      - name: Package
        env:
          # macOS: signed and notarized when these are set; an unsigned build otherwise.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_APPLE_CERT }}
          # Windows: signed through Azure Artifact Signing when these are set.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: npm run ${{ matrix.dist }} -- --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-${{ runner.os }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          # Installers, plus the latest*.yml and .blockmap files the in-app updater reads.
          path: |
            gui/dist/*.dmg
            gui/dist/*.zip
            gui/dist/*.exe
            gui/dist/*.AppImage
            gui/dist/*.blockmap
            gui/dist/latest*.yml
          retention-days: 5
          if-no-files-found: error
          # The installers are compressed already; zipping them again only costs time.
          compression-level: 0

  release:
    needs: [version, test, app]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # to start the website's rebuild
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      WINDOWS_SIGNED: ${{ secrets.AZURE_PUBLISHER_NAME != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag the commit (a release started by hand)
        if: github.ref_type != 'tag'
        run: |
          # Made now, once every build and test has passed. A tag made with this job's token starts
          # no other workflow, so this run is the only release run.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: app-*
          path: parts/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Gather the files and merge the Mac update feed
        run: |
          # Each Mac job wrote a latest-mac.yml naming only its own architecture; installed Macs
          # read one file naming both. Every other file has a name of its own.
          mkdir app
          for f in parts/*/*; do
            NAME=$(basename "$f")
            [ "$NAME" = latest-mac.yml ] && continue
            [ -e "app/$NAME" ] && { echo "::error::$NAME came from two builds"; exit 1; }
            mv "$f" app/
          done
          pip install pyyaml
          python scripts/merge_mac_feed.py app/latest-mac.yml parts/app-macOS-*/latest-mac.yml

      - name: Check the update feed is complete
        run: |
          # Installed copies read these three files; a release without one leaves that platform
          # unable to update.
          for f in latest-mac.yml latest.yml latest-linux.yml; do
            [ -f "app/$f" ] || { echo "::error::$f is missing from the build"; exit 1; }
          done

      - name: Write the release notes
        run: |
          # Changes since the previous app release. App releases were tagged `app-v*` up to 1.0.4;
          # the older `v*` tags are the Python package's, so the newest tag by date is the one.
          PREV=$(git tag --list 'v*' 'app-v*' --sort=-creatordate | grep -vx "$TAG" | head -1 || true)
          ARGS=(-f tag_name="$TAG")
          [ -n "$PREV" ] && ARGS+=(-f previous_tag_name="$PREV")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" --method POST "${ARGS[@]}" --jq '.body' \
            > generated.md || : > generated.md
          [ "$(cat generated.md)" = "null" ] && : > generated.md
          {
            echo "Watchdog desktop app $VERSION ($CHANNEL)."
            echo
            echo "Download the installer for your computer below: the .dmg for a Mac (arm64 for Apple silicon, x64 for Intel), the Setup .exe for Windows, the .AppImage for Linux. An installed copy offers later $CHANNEL releases itself, under Check for Updates (in the Watchdog menu on a Mac, the Help menu on Windows and Linux)."
            if [ "$CHANNEL" = beta ]; then
              echo
              if [ "$WINDOWS_SIGNED" = true ]; then
                echo "This is a test release."
              else
                echo "This is a test release. The Windows installer is not signed yet, so Windows shows a warning the first time it runs: choose More info, then Run anyway."
              fi
            fi
            echo
            cat generated.md
          } > notes.md

      - name: Publish the versioned release
        run: |
          # A stable release becomes the repository's latest, which installed stable copies read for
          # updates; a beta never does. It is created as a draft and published only once every file
          # is on it, so an app checking in between never finds a latest release without its files.
          LATEST="--latest"
          [ "$CHANNEL" = beta ] && LATEST="--latest=false"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            FLAGS="--draft"
            [ "$CHANNEL" = beta ] && FLAGS="$FLAGS --prerelease"
            gh release create "$TAG" --title "Watchdog $VERSION" --notes-file notes.md $FLAGS
          fi
          find app/ -type f -print0 | xargs -0 gh release upload --clobber "$TAG"
          gh release edit "$TAG" --draft=false $LATEST

      - name: Update the rolling release
        run: |
          # Betas update `app-beta`, the feed beta builds read. Copies of 1.0.4 read `app-stable`,
          # so a stable release keeps it current while it exists, and never creates it: deleting
          # that release once every copy has updated past 1.0.4 ends this step for stable releases.
          ROLLING="app-$CHANNEL"
          if [ "$CHANNEL" = stable ] && ! gh release view "$ROLLING" >/dev/null 2>&1; then
            echo "No $ROLLING release; nothing to update."
            exit 0
          fi
          if ! gh release view "$ROLLING" >/dev/null 2>&1; then
            FLAGS="--latest=false"
            [ "$CHANNEL" = beta ] && FLAGS="$FLAGS --prerelease"
            gh release create "$ROLLING" --target "$GITHUB_SHA" --title "Watchdog app, latest $CHANNEL" \
              --notes "Always the newest $CHANNEL of the Watchdog app." $FLAGS
          fi
          # Upload the new files first, then remove the previous version's, so an app checking
          # during the swap finds a complete set.
          find app/ -type f -print0 | xargs -0 gh release upload --clobber "$ROLLING"
          NEW=$(find app/ -type f -printf '%f\n')
          gh release view "$ROLLING" --json assets --jq '.assets[].name' | while read -r NAME; do
            echo "$NEW" | grep -qxF "$NAME" || gh release delete-asset "$ROLLING" "$NAME" -y
          done
          { echo "Always the newest $CHANNEL of the Watchdog app: now $VERSION. This page's files are replaced by each $CHANNEL release, and installed copies check here for updates; [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) keeps this version's files for good."; echo; tail -n +2 notes.md; } > rolling.md
          gh release edit "$ROLLING" --notes-file rolling.md --latest=false

      - name: Rebuild the website
        if: env.CHANNEL == 'stable'
        run: |
          # The website's download buttons name the latest release's files. A release published
          # with this job's token starts no other workflow, so pages.yml's `release` trigger never
          # fires for it; a dispatch is the one event that token can start.
          gh workflow run pages.yml --ref main

  screenshots:
    # After a stable release, the docs' app screenshots (docs/images/app-*.png, which the README
    # and the website show) are taken again from the sample investigation and merged into main,
    # so they never fall behind the app (D320). main's ruleset takes changes only through a pull
    # request, with no approval or check required, so the job opens one and merges it itself. It
    # runs after the release is published, so a failed capture never holds up a release. The
    # sample is built afresh, so its dates and the version in the sidebar differ every time: each
    # stable release merges one pull request.
    #
    # Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull
    # requests". If the merge is refused, the pull request stays open to merge by hand and the job
    # fails, so the run shows it. A test build (run by hand on a branch) takes the screenshots too
    # and keeps them as the run's artifact instead, so the job can be tried.
    needs: [version, release]
    if: >-
      !cancelled() && (
        (needs.release.result == 'success' && needs.version.outputs.channel == 'stable') ||
        needs.version.outputs.release != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write   # to start the website's rebuild
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the engine
        # The sample investigation runs on canned model answers, so the test suite's light
        # dependency list is enough (.github/actions/run-tests): no docling, no torch.
        run: pip install --no-deps -e . && pip install pyyaml pypdf numpy jsonschema httpx truststore nh3 python-docx python-pptx openpyxl Pillow defusedxml anthropic av claude-agent-sdk dateparser

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build the app
        working-directory: gui
        run: npm ci && npm run build

      - name: Take the screenshots
        working-directory: gui
        run: WATCHDOG_PYTHON="$(command -v python)" xvfb-run -a npm run screenshots

      - name: Keep the screenshots (a test build)
        if: needs.version.outputs.release != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshots
          path: docs/images/app-*.png
          retention-days: 5
          if-no-files-found: error

      - name: Merge them into main and rebuild the website
        if: needs.version.outputs.release == 'true'
        run: |
          if git diff --quiet -- docs/images; then
            echo "The screenshots are unchanged."
            exit 0
          fi
          # Taken from the released commit, offered on top of main as it is now.
          cp docs/images/app-*.png "$RUNNER_TEMP/"
          git checkout -- docs/images
          git fetch --depth=1 origin main
          BRANCH="screenshots/$TAG"
          git switch -C "$BRANCH" FETCH_HEAD
          cp "$RUNNER_TEMP"/app-*.png docs/images/
          if git diff --quiet -- docs/images; then
            echo "main already has these screenshots."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git commit -q -m "Docs: retake the app screenshots for $VERSION"
          git push --force origin "$BRANCH"
          PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --base main --head "$BRANCH" --title "Docs: app screenshots for $VERSION" \
              --body "The docs' app screenshots, taken again from the sample investigation after the $TAG release by App release's \`screenshots\` job, which merges this pull request itself (D320). Only images change.")
          fi
          if ! gh pr merge "$PR" --squash --delete-branch; then
            echo "::error::Couldn't merge $PR; it's open to merge by hand."
            exit 1
          fi
          # A merge made with this job's token starts no other workflow, so pages.yml's push
          # trigger doesn't fire; a dispatch is the one event that token can start.
          gh workflow run pages.yml --ref main
