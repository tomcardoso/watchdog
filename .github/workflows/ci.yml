name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff==0.15.*"

      - name: Lint with ruff
        run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `--no-deps` keeps docling's heavy tree out of CI; everything the tests actually import is
      # listed explicitly below. python-docx/python-pptx/openpyxl/Pillow/defusedxml are here so the
      # file_metadata tests (#369) run rather than `importorskip` themselves into a silent pass —
      # a skipped entity-bomb test is worth nothing.
      - name: Install package and dev dependencies
        run: pip install --no-deps -e . && pip install pyyaml pypdf argcomplete numpy pytest pytest-timeout jsonschema httpx nh3 python-docx python-pptx openpyxl Pillow defusedxml

      - name: Run tests
        run: pytest --timeout=60
