name: Installer check

# Run by hand (Actions → Installer check → Run workflow): downloads a published Windows installer,
# installs it silently on a fresh runner, starts the installed app and lets first-run setup build
# its engine, the way a reporter's first launch does. It passes when the backend gets to ready,
# past the start-up gate (gui/scripts/check-installed.mjs). The app's logs and the engine's run log
# are kept either way.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to check (empty for the latest release)
        type: string
        default: ""

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Playwright
        working-directory: gui
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Download the installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/installer"
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --pattern 'Watchdog-Setup-*.exe' --dir "$RUNNER_TEMP/installer"
          ls -l "$RUNNER_TEMP/installer"

      - name: Install it
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\installer\Watchdog-Setup-*.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Watchdog\Watchdog.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Watchdog.exe | Select-Object -First 5; throw "Watchdog.exe not found at $exe" }
          "WATCHDOG_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Start the app and build the engine
        working-directory: gui
        run: node scripts/check-installed.mjs "$WATCHDOG_EXE" "$RUNNER_TEMP/check" 45

      - name: Collect the logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/check/app-data"
          cd "$APPDATA/Watchdog" 2>/dev/null && find . -name '*.log' -o -name '*.json' -path '*engine*' | while read -r f; do
            mkdir -p "$RUNNER_TEMP/check/app-data/$(dirname "$f")" && cp "$f" "$RUNNER_TEMP/check/app-data/$f"
          done
          ls -R "$RUNNER_TEMP/check" | head -50

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: installer-check-windows
          path: ${{ runner.temp }}/check
          retention-days: 5
          if-no-files-found: warn
