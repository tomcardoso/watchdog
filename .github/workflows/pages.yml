name: Website

# Builds the website (site/, from the landing page and docs/) and publishes it to GitHub Pages:
# https://tomcardoso.github.io/watchdog/. It publishes only for a stable release, so the docs
# online describe the app people can download, not unreleased work on main (D362): App release
# starts it by hand after a stable release (a release its own token publishes triggers nothing),
# a stable release published by a person starts it, and it can be run by hand from main. On a
# pull request it only builds, so a broken page fails the check before it merges.

on:
  pull_request:
    # Not for a pull request that changes only the app screenshots: App release's screenshots job
    # merges one at once, and a run waiting for approval on it expires as a failure (D350).
    paths: ['docs/**', '!docs/images/app-*.png', 'site/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    # A pre-release (the rolling beta) is not what the site's download buttons offer.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
