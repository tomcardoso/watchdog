# Benchmark arm matrix (#361 / #215 / #466), consumed by run_benchmark.py.
#
# Frozen references this run verifies before spending anything:
# corpora/extract/corpus-v1.sha256 (the extractor/finalizer corpus) and keys/keys-v4.sha256
# (the answer keys). See BENCHMARKING.md for the protocol this file and run_benchmark.py
# automate; runs are written to the gitignored benchmarks/runs/.

corpus: {dir: corpora/extract, sha256: corpora/extract/corpus-v1.sha256}
keys: {dir: keys, sha256: keys/keys-v4.sha256}

master_vault:
  name: bench-master                     # sidecar'd, reused by extractor + finalizer-base arms
  classify_name: bench-classify-master   # bare-PDF twin, classifier smoke test only

extractor_sweep:
  vault_prefix: bench-ex
  # Each provider's current frontier models only, every arm with the investigation brief (D310).
  # Grouped by provider, then model, then effort; every arm that can pin an effort pins one (the
  # DeepSeek thinking-off arm can't: there is no thinking there to tune, D217). See
  # BENCHMARKING.md for how to run these and FINDINGS.md for what past runs measured.
  #
  # NOT COMPARABLE WITH ARCHIVED RUNS. Every arm here extracts with `briefs/corpus-v1.md` as the
  # vault's context.md, the way a real investigation does; no archived arm had a brief. Arm ids
  # are named after the full model id so none collides with an archived one (`ds-flash`,
  # `gemini-flash-lite`, …) in `score_index.py`, which picks an arm's latest clean run across
  # runs of the same cohort and does not know about the brief.
  #
  # `defaults:` — `brief` applies to every arm (copied onto each by run_benchmark.load_config,
  # so the report records it per arm). `concurrency: 5` (#559): every arm runs concurrently
  # against the whole 6-document corpus, and the account's TPM limit was bracketed between a
  # 236,608 tok/min peak that succeeded and a 291,841 peak that got rate-limited, so 5-way
  # concurrency keeps a plain arm roughly 20% under it. `max_rate_limit_waits` bounds `--wait`'s
  # resume loop so a rate-limited arm surfaces as a partial result within a few waits instead of
  # stalling the sweep.
  #
  # `repeats: N` runs an arm N times, as `<id>-r1` … `-rN`, and the report shows the spread
  # (mean, lowest–highest, standard deviation); `--arms <id>` selects all of them. One run is one
  # sample: archived single runs of one configuration differed by up to 3x (D278). Three runs go
  # to the shipped default, `sonnet-5.5-med`, because every user's documents are read by it, and
  # to the cheap arms (Haiku 5.5, GPT-6 Luna, Gemini 3.5 Flash-Lite, DeepSeek Flash), where a
  # run costs cents, so their spread comes almost free. Every other arm runs once: a difference
  # between two single-run arms is a lead, not a measurement.
  defaults: {concurrency: 5, max_rate_limit_waits: 2, brief: briefs/corpus-v1.md}
  arms:
    # ── Anthropic ── Sonnet 5.5 at medium is what every user runs (D236). Haiku 5.5 defaults to
    # medium on the API, Sonnet 5.5 to high; every arm pins its level. No Opus 5.5, Fable 5.1,
    # GPT-6 Astra or GPT-6.1 Sol arm: those models are not catalogued (D311, D312).
    - {id: sonnet-5.5-med,        extractor_model: sonnet-5.5, extractor_effort: medium, repeats: 3}
    - {id: sonnet-5.5-high,       extractor_model: sonnet-5.5, extractor_effort: high}
    - {id: haiku-5.5-low,         extractor_model: haiku-5.5, extractor_effort: low, repeats: 3}
    - {id: haiku-5.5-med,         extractor_model: haiku-5.5, extractor_effort: medium, repeats: 3}

    # ── OpenAI ──
    - {id: gpt-6-luna-low,        extractor_model: "openai:gpt-6-luna", extractor_effort: low, repeats: 3}
    - {id: gpt-6-luna-med,        extractor_model: "openai:gpt-6-luna", extractor_effort: medium, repeats: 3}

    # ── Gemini ── thinking is always on; each model takes low, medium and high. Argon at its
    # default (medium) and the top level, since the flagship is the one worth pushing.
    - {id: gemini-4-argon-med,    extractor_model: "gemini:gemini-4-argon", extractor_effort: medium}
    - {id: gemini-4-argon-high,   extractor_model: "gemini:gemini-4-argon", extractor_effort: high}
    - {id: gemini-3.8-flash-low,  extractor_model: "gemini:gemini-3.8-flash", extractor_effort: low}
    - {id: gemini-3.8-flash-med,  extractor_model: "gemini:gemini-3.8-flash", extractor_effort: medium}
    - {id: gemini-3.5-flash-lite-low, extractor_model: "gemini:gemini-3.5-flash-lite", extractor_effort: low, repeats: 3}

    # ── DeepSeek ── two knobs, not one (D217): `-thinking` switches thinking mode on, and only the
    # thinking ids take an effort level. `high` is DeepSeek's own default, and `medium`/`xhigh`
    # are its aliases for it, so a thinking arm at `high` is the provider's standard behaviour.
    - {id: deepseek-flash,        extractor_model: "deepseek:deepseek-flash", repeats: 3}
    - {id: deepseek-flash-think-high, extractor_model: "deepseek:deepseek-flash-thinking", extractor_effort: high}
    - {id: deepseek-pro-think-high,   extractor_model: "deepseek:deepseek-v4-pro-thinking", extractor_effort: high}

finalizer_sweep:
  vault_prefix: bench-fn
  # Fixed, cheap, deterministic extraction (#381), with the brief, so the finalizer arms copied
  # from it post-process with a brief as a real investigation does (D310).
  base: {extractor_model: "deepseek:deepseek-flash", brief: briefs/corpus-v1.md}
  arms:
    # Haiku 5.5 is the shipped finalizer (D277), repeated since the finalizer's output (merges,
    # contradictions) varies run to run on one fixed extraction.
    - {id: haiku-5.5-med,         finalizer_model: haiku-5.5, finalizer_effort: medium, repeats: 3}
    - {id: sonnet-5.5-med,        finalizer_model: sonnet-5.5, finalizer_effort: medium}
    - {id: gpt-6-luna-med,        finalizer_model: "openai:gpt-6-luna", finalizer_effort: medium}
    - {id: gemini-3.8-flash-med,  finalizer_model: "gemini:gemini-3.8-flash", finalizer_effort: medium}
    - {id: deepseek-flash,        finalizer_model: "deepseek:deepseek-flash"}

classifier_smoke:
  vault_prefix: bench-classify
  arm: {id: smoke, extractor_model: "deepseek:deepseek-flash", finalizer_model: "deepseek:deepseek-flash"}
  # Sanity check only — corpus-v1 spans 2 skills, not enough to RANK classifier models.

classifier_sweep:
  vault_prefix: bench-classify-sweep
  corpus_dir: corpora/classify    # empty for now — see corpora/classify/README.md
  fixed: {extractor_model: "deepseek:deepseek-flash", finalizer_model: "deepseek:deepseek-flash"}
  arms:
    - {id: haiku-5.5,             classifier_model: haiku-5.5}    # the shipped default (D277)
    - {id: gpt-6-luna,            classifier_model: "openai:gpt-6-luna"}
    - {id: gemini-3.5-flash-lite, classifier_model: "gemini:gemini-3.5-flash-lite"}
    - {id: deepseek-flash,        classifier_model: "deepseek:deepseek-flash"}
  # Model only, no effort sweep: each arm runs at the shipped `classifier_effort` (low) where the
  # model takes it. BLOCKED until classify-corpus/ is populated with a type-diverse document set +
  # expected.yaml labels; run_benchmark.py detects an empty corpus_dir and skips this stage with a
  # one-line notice, so it doesn't block the other stages from running.

# No `sdk_check:` section (D310): it was the subscription leg of the claude-agent-sdk/claude-api
# backend A/B, which this matrix no longer carries. The stage still works; add the section back
# (see BENCHMARKING.md) to run it.
#
# Still deferred (see docs/benchmarks.md "Roadmap"): no CI-trigger section — GitHub Actions
# integration slots in as a new top-level key later without reworking this schema.
