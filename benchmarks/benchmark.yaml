# Benchmark arm matrix (#361 / #215 / #466), consumed by run_benchmark.py.
#
# Frozen references this run verifies before spending anything: corpus/corpus-v1.sha256 (the
# extractor/finalizer corpus) and keys/keys-v1.sha256 (the answer keys). See BENCHMARKING.md for
# the manual protocol this file and run_benchmark.py automate.

corpus: {dir: corpus, sha256: corpus/corpus-v1.sha256}
keys: {dir: keys, sha256: keys/keys-v1.sha256}

master_vault:
  name: bench-master                     # sidecar'd, reused by extractor + finalizer-base arms
  classify_name: bench-classify-master   # bare-PDF twin, classifier smoke test only

extractor_sweep:
  vault_prefix: bench-ex
  # Grouped by provider, then model, then effort. Haiku and DeepSeek have no effort control —
  # asking for one errors. Everything else pins its effort explicitly. See BENCHMARKING.md for
  # how to run these and FINDINGS.md for what past runs measured.
  arms:
    # ── Anthropic ──
    - {id: haiku,             extractor_model: haiku}
    - {id: sonnet-4.6-low,    extractor_model: sonnet-4.6, extractor_effort: low}
    - {id: sonnet-4.6-med,    extractor_model: sonnet-4.6, extractor_effort: medium}
    - {id: sonnet-4.6-high,   extractor_model: sonnet-4.6, extractor_effort: high}
    - {id: sonnet-5-low,      extractor_model: sonnet-5, extractor_effort: low}
    - {id: sonnet-5-med,      extractor_model: sonnet-5, extractor_effort: medium}
    - {id: sonnet-5-high,     extractor_model: sonnet-5, extractor_effort: high}

    # ── OpenAI ──
    - {id: gpt-nano-low,      extractor_model: "openai:gpt-5.4-nano", extractor_effort: low}
    - {id: gpt-nano-med,      extractor_model: "openai:gpt-5.4-nano", extractor_effort: medium}
    - {id: gpt-nano-high,     extractor_model: "openai:gpt-5.4-nano", extractor_effort: high}
    - {id: gpt-mini-low,      extractor_model: "openai:gpt-5.4-mini", extractor_effort: low}
    - {id: gpt-mini-med,      extractor_model: "openai:gpt-5.4-mini", extractor_effort: medium}
    - {id: gpt-mini-high,     extractor_model: "openai:gpt-5.4-mini", extractor_effort: high}
    - {id: gpt-luna-low,      extractor_model: "openai:gpt-5.6-luna", extractor_effort: low}
    - {id: gpt-luna-med,      extractor_model: "openai:gpt-5.6-luna", extractor_effort: medium}
    - {id: gpt-luna-high,     extractor_model: "openai:gpt-5.6-luna", extractor_effort: high}

    # ── Gemini ──
    - {id: gemini-flash-lite, extractor_model: "gemini:gemini-3.1-flash-lite", extractor_effort: low}
    - {id: gemini-flash-low,  extractor_model: "gemini:gemini-3.5-flash", extractor_effort: low}
    - {id: gemini-flash-med,  extractor_model: "gemini:gemini-3.5-flash", extractor_effort: medium}
    - {id: gemini-flash-high, extractor_model: "gemini:gemini-3.5-flash", extractor_effort: high}

    # ── DeepSeek ── (the `-thinking` suffix is the only knob)
    - {id: ds-flash,          extractor_model: "deepseek:deepseek-v4-flash"}
    - {id: ds-flash-think,    extractor_model: "deepseek:deepseek-v4-flash-thinking"}
    - {id: ds-pro,            extractor_model: "deepseek:deepseek-v4-pro"}
    - {id: ds-pro-think,      extractor_model: "deepseek:deepseek-v4-pro-thinking"}

    # ── Paired comparisons ──
    # Each group isolates one variable and is meant to be run on its own with --arms, not as part
    # of a full sweep. Read BENCHMARKING.md before running either — both have setup requirements.
    #
    # Backend A/B (#475) — needs api-key auth.
    - {id: sonnet-med-sdk,    extractor_model: "claude-agent-sdk:sonnet", extractor_effort: medium}
    - {id: sonnet-med-api,    extractor_model: "claude-api:sonnet",       extractor_effort: medium}
    - {id: batch-sonnet-med,  extractor_model: "claude-batch:sonnet",     extractor_effort: medium}
    #
    # Verification pass A/B (#535), on the three candidate models.
    - {id: sonnet-4.6-med-verify,   extractor_model: sonnet-4.6, extractor_effort: medium, verify: true}
    - {id: sonnet-4.6-med-noverify, extractor_model: sonnet-4.6, extractor_effort: medium, verify: false}
    - {id: gpt-mini-low-verify,     extractor_model: "openai:gpt-5.4-mini", extractor_effort: low, verify: true}
    - {id: gpt-mini-low-noverify,   extractor_model: "openai:gpt-5.4-mini", extractor_effort: low, verify: false}
    - {id: gpt-luna-low-verify,     extractor_model: "openai:gpt-5.6-luna", extractor_effort: low, verify: true}
    - {id: gpt-luna-low-noverify,   extractor_model: "openai:gpt-5.6-luna", extractor_effort: low, verify: false}

finalizer_sweep:
  vault_prefix: bench-fn
  base: {extractor_model: "deepseek:deepseek-v4-flash"}   # fixed, cheap, deterministic (#381)
  arms:
    - {id: haiku,             finalizer_model: haiku}
    - {id: sonnet-high,       finalizer_model: sonnet, finalizer_effort: high}
    - {id: sonnet-med,        finalizer_model: sonnet, finalizer_effort: medium}
    # finalizer_effort still defaults to high and has never been benchmarked at any lower effort.
    - {id: sonnet-low,        finalizer_model: sonnet, finalizer_effort: low}
    - {id: ds-flash,          finalizer_model: "deepseek:deepseek-v4-flash"}
    - {id: ds-pro-think,      finalizer_model: "deepseek:deepseek-v4-pro-thinking"}
    - {id: gemini-flash-lite, finalizer_model: "gemini:gemini-3.1-flash-lite"}
    - {id: gemini-flash,      finalizer_model: "gemini:gemini-3.5-flash"}
    # Opus dropped. OpenAI (#453 closed): the finalizer is near-constant cost per run, so one or
    # two arms is plenty — same D98 structured-output caveat as the extractor sweep (above)
    # applies here too.
    - {id: gpt-mini,          finalizer_model: "openai:gpt-5.4-mini"}
    - {id: gpt-nano,          finalizer_model: "openai:gpt-5.4-nano"}

classifier_smoke:
  vault_prefix: bench-classify
  arm: {id: smoke, extractor_model: "deepseek:deepseek-v4-flash", finalizer_model: "deepseek:deepseek-v4-flash"}
  # Sanity check only — corpus-v1 spans 2 skills, not enough to RANK classifier models.

classifier_sweep:
  vault_prefix: bench-classify-sweep
  corpus_dir: classify-corpus     # empty for now — see classify-corpus/README.md
  fixed: {extractor_model: "deepseek:deepseek-v4-flash", finalizer_model: "deepseek:deepseek-v4-flash"}
  arms:
    - {id: haiku,             classifier_model: haiku}    # shipped default
    - {id: sonnet,            classifier_model: sonnet}
    - {id: ds-flash,          classifier_model: "deepseek:deepseek-v4-flash"}
    - {id: gemini-flash-lite, classifier_model: "gemini:gemini-3.1-flash-lite"}
  # Classifier has no effort knob (BENCHMARKING.md) — model only, no effort sweep. BLOCKED until
  # classify-corpus/ is populated with a type-diverse document set + expected.yaml labels;
  # run_benchmark.py detects an empty corpus_dir and skips this stage with a one-line notice, so
  # it doesn't block the other three stages from running.

sdk_check:
  # The third leg of the backend A/B above (extractor_sweep's sonnet-med-sdk/sonnet-med-api
  # pair): the same claude-agent-sdk pin, run later under subscription auth instead of api-key,
  # once the metered pair has a baseline to compare against. Not part of the default sweep —
  # switch `watchdog auth` to subscription first, then run it on its own:
  #     run_benchmark.py --stages sdk-check
  # A harness/backend spot-check, not a quality re-run, so it uses a two-document subset (one
  # short, one mid-sized — see BENCHMARKING.md) rather than the full six-document corpus, to
  # keep it cheap on subscription session time. Excluded from the extractor-sweep recall
  # scoring and the six-document cost summary for the same reason: its corpus doesn't match.
  vault_prefix: bench-sdkcheck
  corpus_dir: sdk-check-corpus
  arms:
    - {id: sonnet-med-sdk-sub, extractor_model: "claude-agent-sdk:sonnet", extractor_effort: medium}

# Still deferred (see docs/benchmarks.md "Roadmap"): no CI-trigger section — GitHub Actions
# integration slots in as a new top-level key later without reworking this schema.
