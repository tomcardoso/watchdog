  - id: M11.1
    item: >
      The employee future benefit position swung from a $1,929 thousand asset (2019) to a
      $20,788 thousand liability (2020), an $11.5 million increase.
    basis: inferred
    why_inferred: >
      The $11.5M liability increase and the fact that the prior-year asset became a current-year
      liability are stated in commentary on page 12 ('Employee future benefit assets were $1.9M
      in the prior year and are now a liability in 2020, based on actuarial valuation.' /
      'Employee future benefits liabilities increased $11.5M based on actuarial valuation.'),
      and the exact $1,929/$20,788 figures appear only in the statement-of-financial-position
      tables (pages 19, 29). Both commentary sentences attribute the change to 'actuarial
      valuation' generally, not specifically to a discount-rate change -- that causal link is
      stated only in a separate paragraph on page 8 ('The reduction of the discount rate has
      increased the liability component to the plan...'), which discusses the pension plan in
      general, not this specific $11.5M line item. Tying the swing specifically to the discount
      rate requires combining page 8 with page 12 and the tables.
    pages:
      - 12
      - 19
    location: balance sheet line + highlights commentary
    why: >
      An asset became a liability. It is presented as a routine actuarial remeasurement in a
      single commentary sentence.

