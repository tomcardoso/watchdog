  - id: M12.1
    item: >
      "Subsequent to year-end, principal repayments on four loans relating to the operations of
      the residences were deferred for six months."
    basis: inferred
    why_inferred: >
      The core sentence is quoted verbatim and appears on page 7 (and again, with slightly
      different wording, in note 8 on page 29). But nothing in the document explicitly frames
      this deferral as occurring 'before the 30 October 2020 report date' -- that date is stated
      only in the auditors' report signature block on page 18. Connecting 'subsequent to year-
      end' (page 7) to the report date (page 18) requires combining two different parts of the
      document.
    pages:
      - 7
      - 11
      - 30
      - 35
    location: Financial Statement Highlights (Capital financing), MD&A "Future Impact of COVID-19", Note 8 (Long-term debt), and Note 17 (Effects of COVID-19) — stated four times

    why: >
      A subtle cash-crunch signal that survived into the final report despite the clean audit
      opinion (M1) and the "on track" narrative (F1) — LU was already deferring debt service
      before this report was even issued.

