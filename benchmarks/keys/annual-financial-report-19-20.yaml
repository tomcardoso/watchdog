  - id: M13
    item: >
      The University states it relies on the Ministry of Colleges and Universities to help it meet its
      financial obligations, alongside a requirement to hit sustainability targets.
    page: 23
    location: "Notes to Consolidated Financial Statements, introductory paragraph"
    quote:
      - "Consistent with prior years, the University has a level of reliance on the Ministry of Colleges and"
      - "Universities to assist in meeting its obligations and also a requirement to meet its sustainability targets."
    why: >
      A direct admission of reliance on government support to meet obligations, sitting in tension
      with the clean, unqualified audit opinion that carries no going-concern modification; a reporter
      who missed this would be missing a key thread in the University's financial-health story.
  - id: M14
    item: >
      The University consolidates only its 20% share of SNOLAB's revenue and expenses through March
      31, 2019 — SNOLAB's 2020 figures were not yet available when these statements were prepared —
      and it wrote off its share of SNOLAB's assets and liabilities as at April 30, 2018 because it
      will lose access to them once SNOLAB incorporates separately.
    page: 25
    location: "Note 1(f), Related entities and basis of presentation — SNOLAB"
    quote:
      - "As a result, the University's proportionate share (20%) of the entity's revenues and"
      - "expenses to March 31, 2019 have been included in these consolidated financial statements."
      - "The"
      - "2020 financial statements are not yet available."
      - "SNOLAB is in the process of incorporating"
      - "as a not-for-profit corporation."
      - "Therefore, the University wrote-off its share of assets and"
      - "liabilities as at April 30, 2018 as it will no longer have access to the assets or liabilities related"
      - "to the operations of SNOLAB once incorporated."
    why: >
      The "consolidated" financial statements actually include stale, up-to-two-year-old data for
      SNOLAB and a prior write-off of that entity's assets/liabilities; a reporter relying on these
      statements to assess SNOLAB-related exposure would be misled without this caveat.
  - id: M15
    item: >
      The allowance for doubtful accounts on the University's receivables rose to $5,020 thousand in
      FY2020 from $3,120 thousand in FY2019 — a 61% increase.
    page: 28
    location: "Note 3, Accounts receivable table"
    quote:
      - "Less allowance for doubtful accounts"
      - "(5,020)"
      - "(3,120)"
    why: >
      A sharp rise in bad-debt provisioning is a direct, quantified sign of deteriorating
      collectability on the University's receivables, consistent with the additional credit risk
      booked on tuition receivable, and central to any story about the University's financial
      deterioration.
  - id: M16
    item: >
      The supplemental pension plan for employees whose benefits would otherwise exceed Canada Revenue
      Agency limits is entirely unfunded — its accrued benefit obligation equals its accrued benefit
      liability of $3,063 thousand, with no plan assets set aside.
    page: 28
    location: "Note 4, Employee future benefits table"
    quote:
      - "Accrued benefit liabilities"
      - "(3,063)"
    why: >
      An unfunded, CRA-limit top-up pension plan with zero assets set aside is a natural investigative
      target; missing it would mean missing a distinct, unfunded supplemental-benefit liability
      separate from the main pension plan already covered.
  - id: M17
    item: >
      The University's internally restricted "Reserve for future years" was drawn down to zero in
      FY2020, from $744 thousand the prior year.
    page: 32
    location: "Note 11, Internally restricted net assets table"
    quote:
      - "Reserve for future years"
      - "744"
    why: >
      A rainy-day reserve being fully depleted in the same year the University posted a $5.4 million
      operating deficit is a material sign of shrinking financial cushion that a reporter needs to
      catch.
  - id: M18
    item: >
      Students approved, by referendum, a levy to repay a long-term debt facility funding a new
      Student Centre, and the Board of Governors has approved a University guarantee of that student
      loan up to $8,500 thousand.
    page: 33
    location: "Note 13(c), Commitments and contingencies"
    quote:
      - "The Students' General Association, through a referendum, approved a student levy to cover the"
      - "repayment of a student long-term debt facility to provide funding for a new Student Centre."
      - "the"
      - "Board of Governors of the University has approved that the University guarantee the student"
      - "loan up to the amount of $8,500."
    why: >
      A material contingent liability — an up-to-$8.5-million guarantee — tied to a student-approved
      levy, an item a reporter covering the University's total debt exposure or student finances would
      need to know about.
  - id: M19
    item: >
      The University discloses that it is involved in unspecified legal matters and litigation whose
      outcomes are not presently determinable.
    page: 33
    location: "Note 13(d), Commitments and contingencies"
    quote:
      - "The University is involved in certain legal matters and litigation, the outcomes of which are not"
      - "presently determinable."
      - "The loss, if any, from these contingencies will be accounted for in the"
      - "periods in which the matters are resolved."
    why: >
      An acknowledgment of open, undisclosed litigation with an indeterminate financial outcome is
      exactly the kind of contingent liability a reporter needs to flag and try to identify, even
      though the statements do not name the matters.
