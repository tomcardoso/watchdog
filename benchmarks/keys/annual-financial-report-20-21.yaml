      - "The engagement of a Chief Redevelopment Officer"
      - "('CRO') appointed by the"
      - "Court to assist Laurentian in a number of strategic initiatives."
    why: >
      A court-appointed executive overseeing the university's turnaround is a figure reporters would
      want to identify and follow up on.
  - id: M24
    item: >
      The main (non-employee) creditor claims process set July 30, 2021 as the deadline for creditors
      to identify and file claims against Laurentian.
    page: 6
    location: "restructuring initiatives list"
    quote:
      - "Implementation of the main (non-employee) claims"
      - "procedure with a claim's"
      - "deadline of July 30, 2021"
    why: >
      A concrete legal deadline governing who could recover money from the university — essential for
      tracking the creditor process.
  - id: M25
    item: >
      The university states that, although it will not be affected by performance-based funding in
      2021-22, the CCAA restructuring will make it unlikely that Laurentian can achieve its
      performance-based SMA3 metrics and its enrolment-based corridor funding at least in the medium
      term.
    page: 12
    location: "Operating Grants and Contracts"
    quote:
      - "the CCAA restructuring will make it unlikely that it will"
      - "be able to achieve its performance-based SMA3 metrics and its enrolment-based"
      - "corridor funding at least in"
      - "the medium term."
    why: >
      The university's own admission that its restructuring undermines its ability to hit the
      funding-metric targets tied to future provincial money — a forward risk reporters should flag.
  - id: M26
    item: >
      A portion of the $18.6 million in deferred research-grant contributions is potentially subject
      to compromise under a CCAA Plan, but due to the uncertainty in the ongoing proceedings, the
      total amount that could be clawed back cannot be reasonably determined.
    page: 13
    location: "Research Grants and Contracts"
    quote:
      - "A portion of the deferred contributions balance is"
      - "potentially subject to compromise under a CCAA Plan,"
      - "however due to the uncertainty in the ongoing CCAA"
      - "proceedings, the total balance cannot be reasonably"
      - "determined."
    why: >
      Signals an additional, unquantified pool of money — beyond the $186.8 million already recognized
      — that the restructuring could still reach: a live financial unknown.
  - id: M27
    item: >
      Housing, food and parking services accounted for 72% of the ancillary revenue shortfall in
      2020-21, with average residence occupancy falling to 40%, compared with a historical average of
      over 96% in the preceding five years.
    page: 14
    location: "Sales and Services"
    quote:
      - "Housing, Food, and Parking services account for"
      - "72% the shortfall"
      - "40% in 2020-21, compared to a historical"
      - "average of over 96% in the last five years."
    why: >
      A dramatic, concrete collapse figure — 96% to 40% occupancy — illustrating the pandemic's
      financial impact on residences.
  - id: M28
    item: >
      Laurentian's pension plan had an accrued benefit obligation of $452,203 thousand against plan
      assets of $461,738 thousand at April 30, 2021 — a $9,535 thousand surplus — but the University
      recorded a full $9,535 thousand valuation allowance against it, so no asset from the surplus was
      recognized in the financial statements.
    page: 44
    location: "Note 6 Employee future benefits table"
    quote:
      - "Accrued benefit obligation"
      - "(452,203)"
      - "Fair value of plan assets"
      - "461,738"
      - "Allowance for benefit reinstatement"
      - "(9,535)"
    why: >
      Reveals a near-half-billion-dollar pension plan swung to a real surplus thanks to benefit cuts,
      yet the university chose not to book any of that surplus as an asset — a striking,
      counterintuitive fact.
  - id: M29
    item: >
      Despite the University's financial crisis, it assessed potential impairment of its capital
      assets and determined that no impairment allowance was required, on the basis that its buildings
      remain an integrated asset group still used for ongoing academic and research operations.
    page: 45
    location: "Note 7 Capital assets"
    quote:
      - "The  University  assessed  potential  impairment  of  its  capital  assets  and  determined  that  an"
      - "impairment allowance was not required."
    why: >
      A conspicuous decision reporters should scrutinize — no write-down was taken on roughly $263
      million of capital assets even as the university reported insolvency and a going-concern
      warning.
  - id: M30
    item: >
      Beyond the data-breach and employee claims already disclosed, third parties have submitted CCAA
      claims relating to delays and disputes with construction contractors and losses from disclaimed
      or terminated contracts — claims the University itself describes as material.
    page: 56
    location: "Note 18(d) Commitments and contingencies"
    quote:
      - "third parties have submitted"
      - "claims pursuant to CCAA"
      - "claims procedures relating to delays and disputes with construction contractors and losses from"
      - "disclaimed or terminated contracts all of which are not presently determinable.  Claims asserted"
      - "as part of these proceedings are material."
    why: >
      Identifies an additional category of material, unresolved litigation — construction contractor
      claims — separate from the data breach claims already in the key.
  - id: M31
    item: >
      Laurentian identified that it had failed to record an estimated accrual, each fiscal year-end,
      for its payment to the Financial Services Regulatory Authority of Ontario's Pension Benefit
      Guarantee Fund, and corrected the 2020 comparative figures by $702 thousand as a result.
    page: 63
    location: "Note 25 Correction of immaterial prior period errors — PBGF"
    quote:
      - "The University identified that an estimate of the accrual related to the payment to the Financial"
      - "Services  Regulatory  Authority  of  Ontario  for  the  Pension  Benefit  Guarantee  Fund  (PBGF)"
      - "amount was not recorded each fiscal year-end."
    why: >
      An admitted, recurring bookkeeping failure involving a mandatory pension-insurance levy —
      evidence of weak financial controls ahead of the insolvency.
  - id: M32
    item: >
      The University performed an in-depth analysis of its endowments covering the prior 17 years and
      identified errors in the allocation of investment earnings to endowment funds and in the
      distribution of amounts from endowments, resulting in an understatement of Endowment net assets
      of $1,454 thousand.
    page: 64
    location: "Note 25 Correction of immaterial prior period errors — Endowment"
    quote:
      - "The University performed an in-depth analysis of its endowments for the prior 17 years which"
      - "identified  errors  in  the  allocation  of  investment  earnings  to  endowment  funds  and  in  the"
      - "distribution  of  amounts  from  endowments  in  prior  years."
    why: >
      An unusually long, 17-year span of donor-endowment accounting errors is a striking governance
      detail for a story about the university's financial management.
  - id: M33
    item: >
      Excluding the impact of CCAA-related costs and prior-period adjustments, management calculates
      an adjusted Excess of Revenue over Expenses of $12.2 million for 2020-21 — a positive underlying
      result, in contrast to the headline $66.7 million deficiency.
    page: 21
    location: "Conclusion"
    quote:
      - "Excluding the impact of CCAA and prior-period"
      - "adjustments, the results show an adjusted Excess of"
      - "Revenue over Expenses of $12.2 million, which includes"
      - "the partial realization of the cost savings generated by"
      - "the CCAA restructuring"
    why: >
      Management's own non-GAAP framing of a positive underlying result — essential counter-narrative
      to the reported deficiency, and something a reporter should scrutinize as spin versus substance.
  - id: M34
    item: >
      Management states that the financial statements do not reflect the adjustments that would be
      necessary if the going concern basis were not appropriate, and that if it were not, significant
      adjustments to the carrying values of assets and liabilities and to reported revenues and
      expenses could be material.
    page: 34
    location: "Note 2(c) Going concern"
    quote:
      - "The consolidated financial statements do not reflect the adjustments that would be necessary"
      - "if the going concern basis was not appropriate. If the going concern basis was not appropriate,"
      - "then significant adjustments would be necessary to the carrying values of assets and liabilities"
      - "and  the  reported  revenues  and  expenses  and  the  classification  used  in  the  consolidated"
      - "statement of financial position. These adjustments could be material."
    why: >
      A direct warning from management that the entire balance sheet could look materially different
      under a liquidation basis — critical framing for every other dollar figure in the statements.
