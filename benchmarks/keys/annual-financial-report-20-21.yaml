contradictions:
  - id: C1
    type: cross-document
    against: "Annual-Financial-Report-19-20.pdf (corpus document 1)"
    this_document_claims: >
      The deficits are long-run and structural — "many years of recurring operational deficits",
      declining enrolment since 2015-16, and the 2019 tuition cut and freeze. The accumulated
      deficit had already reached $42.2M by the end of April 2020.
    page: 5
    other_document_claims: >
      The FY2019-20 report attributes the $5.4M operating deficit almost entirely to the pandemic
      ("$5.2 million is related to the COVID-19 outbreak") and says LU was "on track" with an
      anticipated "small deficit of $0.9 million", while "tracing its path to sustainability".
    why_it_matters: >
      The same institution, one year apart, gives two incompatible accounts of WHY it was losing
      money. Both are explicit positive claims, so an extractor can fire on the conflict without
      having to prove a negative.
  - id: C2
    type: cross-document
    against: "Annual-Financial-Report-19-20.pdf (corpus document 1)"
    this_document_claims: >
      FY2020 figures as previously reported were WRONG and have been restated: opening net assets
      $53,164 → $52,010; opening cash $7,505 → $5,185.
    page: 30
    other_document_claims: "The FY2019-20 report presented those original, later-corrected figures as audited fact."
    why_it_matters: >
      A restatement is a self-declared contradiction with a prior published document. If the vault
      holds both reports, the extractor has both numbers stated explicitly.

# Buried items — built against the mechanical note inventory above. Scored SEPARATELY from facts.
must_not_miss:
  - id: M1
    item: >
      The auditors' report is DUAL-DATED: "March 7, 2022, except as to Note 27, which is as of
      April 22, 2022."
    quote:
      - "March 7, 2022, except as to Note 27, which is as of April 22, 2022"
    page: 27
    location: auditors' signature block, final line
    why: >
      A dual date is the auditor formally limiting how far forward their responsibility runs. It
      is one line, in a signature block, on the last page of the audit report — and it is the
      strongest single signal in the document that something went wrong after publication.

  - id: M2
    item: >
      The Board of Governors signature block on the balance sheet has TWO BLANK 'Governor'
      lines.
    quote:
      - "\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_  Governor"
      - "\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_  Governor"
    page: 28
    location: foot of the Consolidated Statement of Financial Position
    why: >
      The statements are presented "On behalf of the Board of Governors" over two unsigned
      lines. Extractors reliably drop signature blocks entirely.

  - id: M3
    item: >
      Note 27 exists at all — a restatement OF the already-restated statements, made after
      issuance for errors discovered post-publication.
    basis: inferred
    why_inferred: >
      Note 27's heading and opening sentence state that the already-issued financial statements
      were amended for errors found after issuance, but the text never itself characterizes this
      as a restatement OF the already-restated statements. That characterization requires
      knowing (from the separate Note 25) that the same figures had already been restated once
      before, then noticing Note 27 restates the 2021 figures again -- a cross-note comparison,
      not a stated fact.
    page: 68
    location: final substantive note, page 68 of 70
    why: >
      Second-to-last note in a 70-page document. This is the archetypal buried item: the most
      damaging disclosure, placed last.

  - id: M4
    item: >
      Total claims asserted by creditors of $360,291 thousand versus $186,820 thousand
      recognized — a $173.5M gap deliberately not recognized.
    quote:
      - "Total claims asserted by creditors are $360,291 pursuant to the claim procedures approved by the Court."
      - "The difference between the total claims asserted and the amount recognized as subject to compromise  of  $186,820  is  not  recognized  in  these  financial  statements  as  the  University  is assessing  the  claims  and  cannot  estimate  an  amount  subject  to  compromise  based  on  the information available at this time."
    page: 49
    location: Note 12, prose paragraph AFTER the table
    why: >
      Sits below a table. Extractors that parse the table capture $186,820 and stop reading
      before the sentence that says the real number may be nearly twice that.

  - id: M5
    item: >
      Interest rate swap termination obligation of $24,700 thousand.
    quote:
      - "| Interest rate swap termination obligation (note 11)                                        | 24,700                 |"
    page: 48
    location: Note 12 table row; repeated in Note 21 (p. 58)
    why: >
      A derivative unwind buried as a single table row. Nothing in the MD&A mentions that LU
      held interest rate swaps at all.

