  - id: M20.1
    item: >
      Total revenue was $193.4 million.
    basis: inferred
    why_inferred: >
      The infographic's numbers and their labels sit on separate lines in the extracted text,
      interleaved with unrelated captions and repeated '[image]' markers (e.g. the figure '$
      193.4M' precedes, rather than sits beside, the words 'TOTAL' and 'REVENUE' several lines
      later; '- $ 85.9M' sits directly above the 'Capital Spending' heading even though it is
      actually the Available Expendable Resources figure). No contiguous span states any one of
      these eight figures together with its correct label, so pairing each number to its label
      requires reconstructing the original visual layout rather than reading stated text.
    page: 3
    location: page-3 infographic
    why: >
      TEXT-EXTRACTION HAZARD, flagged deliberately. In the raw text layer the figures detach
      from their labels and interleave (the "-$85.9M" appears adjacent to "Capital Spending",
      which is wrong). Any condition that reports these numbers with the WRONG labels attached
      has been caught by a table-flattening failure, not a reasoning failure — score it as such,
      and check whether chew/Docling reproduces the same scrambling before blaming the
      extractor.

