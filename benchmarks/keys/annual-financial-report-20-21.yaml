      any reporter covering the case needs.
  - id: M23
    item: >
      As part of the CCAA restructuring, the Court authorized the engagement of a Chief Redevelopment
      Officer ("CRO") to assist Laurentian with a number of strategic initiatives.
    page: 6
    location: "restructuring initiatives list"
