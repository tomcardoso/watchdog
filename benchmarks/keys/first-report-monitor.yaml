  - id: M2
    item: >
      Firm Capital Corporation executed the term sheet, then ASSIGNED its interest to Firm
      Capital Mortgage Fund Inc., which is the actual DIP Lender. These are two distinct
      entities.
    quote:
      - "the Applicant executed a term sheet (the ' DIP Term Sheet ') with Firm Capital Corporation."
      - "Subsequent to the execution of the DIP Term Sheet, Firm Capital Corporation assigned its interest to Firm Capital Mortgage Fund Inc. (the ' DIP Lender ')."
    page: 8
    paragraph: 33
    why: >
      Document 3 names only "Firm Capital Corporation". An extractor that collapses these into
      one entity has lost the assignment; one that creates two unlinked entities has lost the
      relationship. Both failure modes are worth catching, and this is the only place the
      distinction is stated.

  - id: M3
    item: >
      The $500,000 DIP commitment fee, deemed FULLY EARNED on the date of court approval.
    quote:
      - "a  commitment  fee  of  $500,000  shall  be  deemed  to  have  been  fully  earned  and payable to the DIP Lender on the date that the Court approves the Amended and Restated Initial Order approving the DIP financing."
    page: 9
    paragraph: 34(f)
    why: >
      Half a million dollars payable simply for the court signing — earned before a dollar is
      advanced. It is the last item in a lettered list of facility terms, exactly where
      attention runs out.

  - id: M4
    item: >
      LU declined TWO expressions of interest in competing DIP financing, received 4 and 5
      February 2021, days before the comeback motion.
    quote:
      - "The Monitor notes that on February 4, 2021, counsel to the Applicant and counsel to the Monitor were contacted by a law firm indicating the firm had a client that was potentially interested in submitting a competing proposal for DIP financing."
      - "On February 5, 2021, the Monitor was contacted by another party expressing similar interest."
      - "Accordingly, the Applicant declined the request from the law firm to proceed with any due diligence process and the Monitor communicated the same message to the other party."
    page: 9
    paragraph: 36
    why: >
      The insolvent institution turned away potential competing lenders while locked into an
      8.5% facility with a $500K fee. The paragraph reads as procedural housekeeping and is easy
      to skim.

  - id: M5
    item: >
      The DIP extension milestones rest on the lender's "sole and unfettered discretion" — the
      phrase appears twice, including on the question of whether LU is financially sustainable.
    quote:
      - "to the satisfaction of the DIP Lender in its sole and unfettered discretion:"
      - "LU provides the DIP Lender with a revised cash flow forecast and a multiyear  budget  demonstrating  to  the  DIP  Lender,  in  its  sole  and  unfettered discretion, that LU is financially sustainable."
    page: 8
    paragraph: 34(b)
    why: >
      A private lender holds unilateral judgment over whether a public university continues.
      Buried in sub-sub-clauses.

  - id: M6.1
    item: >
      The Administration Charge increases from $400,000 to $1,250,000.
    quote:
      - "an increase in the Administration Charge from $400,000 to $1,250,000;"
    page: 2
    paragraph: 4(d)
    why: >
      $6.25M of super-priority charges jumping the queue ahead of existing secured lenders,
      listed as roman-numeral sub-items on page 2 in a purpose statement.

