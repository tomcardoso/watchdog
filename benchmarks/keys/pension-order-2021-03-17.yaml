      extraction loses text.

  - id: M6
    item: >
      Derek Harland appears in two capacities: deponent of the Affidavit of Service (p. 2) and
      counsel at TGF (p. 5).
    basis: inferred
    why_inferred: >
      The document never states Derek Harland's two roles together. It requires joining a
      mention on page 1 ("the Affidavit of Service of Derek Harland sworn March 10, 2021") with
      a separate mention on page 5, where he is listed on the backsheet as counsel ("Derek
      Harland (LSO# 79504N)") at Thornton Grout Finnigan LLP. Recognizing these as the same
      person in two capacities requires combining front and back matter.
    pages:
      - 2
      - 5
    location: recital + backsheet
    why: >
      Requires joining the front and back of the document. A per-section extractor sees the two
      mentions in different chunks and will usually emit two unlinked entities, or one.

  - id: M7
    item: >
      The five named Interim CV Applicants (Leduc, Zapalski, Pegoraro, Oxley, McGillis) — real
