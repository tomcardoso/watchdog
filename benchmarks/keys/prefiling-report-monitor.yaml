  - id: M22
    item: >
      The Proposed Monitor notes it is not unusual for universities to deposit restricted funds into
      their main operating account, and such universities usually have sufficient cash reserves to
      cover the resulting obligations — but LU's own funds are insufficient to cover its
      restricted-fund obligations.
    pages: [31, 32]
    location: "para 168, Cash Management"
    quote:
      - "it  is  not  uncommon  for  universities  to  deposit"
      - "Research  Grants  and  other  restricted  funds  into  their  main  operating  account."
      - "in LU's case, as a result of its historical deficits and other issues"
      - "described  above,  the  funds  held  by  LU  at  the  current  time  are  insufficient  to  cover"
      - "obligations in connection with these restricted funds."
    why: >
      Reframes the co-mingling story already in the key: mixing restricted funds with operating cash
      is common university practice, but what makes LU's situation dangerous is that it no longer has
      the cash reserves other schools would have to cover the shortfall — a nuance needed to avoid
      overstating comingling itself as the wrongdoing.
