appId: com.github.tomcardoso.watchdog
productName: Watchdog
copyright: Copyright © Tom Cardoso
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/icon.png
# The managed engine: the app installs Watchdog into a private Python environment on first run
# (src/main/engine.ts). It needs two things from the package: the uv binary for the platform being
# built (scripts/fetch-uv.mjs, into resources/bin/<os>-<arch>/) and a wheel of this repository
# (scripts/build-wheel.mjs, into resources/python-wheel/). Both are produced by the `predist*`
# npm scripts. `${os}` and `${arch}` are electron-builder's macros for the target being built.
extraResources:
  - from: resources/bin/${os}-${arch}
    to: bin
    filter:
      - uv
      - uv.exe
  - from: resources/python-wheel
    to: python-wheel
    filter:
      - '*.whl'
asarUnpack:
  - out/renderer/assets/*.mjs
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  darkModeSupport: true
dmg:
  title: Watchdog
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Tom Cardoso
# No auto-update feed yet: installers are built locally, not published.
publish: null
