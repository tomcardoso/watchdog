[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The engine the desktop app bundles and installs; it is not published on its own. ("watchdog" is
# taken on PyPI by a filesystem-events library, hence "watchdog-intel".)
name = "watchdog-intel"
version = "1.0.14"
description = "Investigative journalism document intelligence — drop records, find connections"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["journalism", "documents", "ocr", "investigative", "obsidian", "public-records"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "docling>=2.0",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "fastembed>=0.4",
    "jsonschema>=4.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    # Verifies TLS via the OS trust store rather than the bundled certifi CA list, so a
    # corporate TLS-inspecting proxy whose root CA the OS already trusts
    # doesn't fail cert verification on outbound OpenAI-compatible calls.
    "truststore>=0.9",
    "claude-agent-sdk>=0.2.164",   # Ask Claude sessions: `tools`, `settings`, `strict_mcp_config`, the in-process server (D299, D304)
    "nh3>=0.2",
    "ocrmac; sys_platform == 'darwin'",
    # Previously only transitive dependencies of docling; declared explicitly (#369) since
    # file_metadata.py reads them directly to capture embedded document/image metadata —
    # depending on a transitive dep risks a mystery breakage when docling reshuffles its own
    # requirements. Already downloaded either way, so this adds nothing to install size.
    "python-docx>=1.0",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    # Office metadata lives in XML inside an untrusted document. The stdlib xml.etree parser
    # expands internal entities, so a hostile .docx could ship a billion-laughs bomb; defusedxml
    # refuses. Any XML parsed out of a document goes through this, never xml.etree.
    "defusedxml>=0.7",
    # Local person/org/location detection for the extraction candidate harvest (#361, D123) —
    # mandatory since D223: torch/transformers/onnxruntime are already forced in by docling and
    # fastembed above, so this adds ~5MB of packages plus a one-time ~1.1GB model download, not
    # the standalone PyTorch pull it looked like when it shipped as an optional extra.
    "gliner>=0.2",
    # Local transcription of audio and video (D273). faster-whisper runs Whisper on CTranslate2;
    # PyAV decodes with the FFmpeg libraries its wheels carry, so no system ffmpeg is needed.
    # Wheels exist for macOS arm64/x64, Windows x64 and Linux x64; onnxruntime and tokenizers
    # (which faster-whisper also needs) are already here through docling, fastembed and gliner.
    "faster-whisper>=1.1",
    "av>=12",
    # Reads the dates documents print in words in ~200 languages (D329); pure Python, with
    # regex, pytz and tzlocal, so it installs in the engine's first phase.
    "dateparser>=1.2",
]

[project.optional-dependencies]
tesseract = ["tesserocr"]       # Faster Tesseract OCR; requires system Tesseract headers
web = ["playwright>=1.49"]      # Rendered web capture for web research — requires `playwright install chromium`
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "numpy>=1.24", "ruff>=0.15"]

[project.urls]
Homepage   = "https://github.com/tomcardoso/watchdog"
Repository = "https://github.com/tomcardoso/watchdog"
Issues     = "https://github.com/tomcardoso/watchdog/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/watchdog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `slow` tests need a real downloaded model; run them with `pytest -m slow`.
markers = ["slow: needs a downloaded local model; deselected by default"]
addopts = "-m 'not slow'"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Conservative, correctness-focused set: pyflakes (F) for real errors like unused
# imports/vars plus the pycodestyle logical-error subsets (E4/E7/E9). Line-length
# (E501) and import sorting (I) are intentionally not enforced — this project does
# not adopt an autoformatter or import reordering here, only correctness lint.
select = ["E4", "E7", "E9", "F"]

