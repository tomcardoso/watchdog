[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Note: "watchdog" is taken on PyPI (filesystem events library).
# Package name is "watchdog-intel"; the CLI command is still "watchdog".
name = "watchdog-intel"
version = "0.1.0a6"
description = "Investigative journalism document intelligence — drop records, find connections"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["journalism", "documents", "ocr", "investigative", "obsidian", "public-records"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "docling>=2.0",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "fastembed>=0.4",
    "argcomplete>=3.0",
    "jsonschema>=4.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "claude-agent-sdk>=0.1",
    "nh3>=0.2",
    "ocrmac; sys_platform == 'darwin'",
]

[project.optional-dependencies]
asr = ["docling[asr]"]          # Audio/video transcription — requires ffmpeg
tesseract = ["tesserocr"]       # Faster Tesseract OCR; requires system Tesseract headers
web = ["playwright>=1.49"]      # Rendered web capture for `watchdog research`/`fetch` — requires `playwright install chromium`
dev = ["pytest>=8.0", "numpy>=1.24", "ruff>=0.15"]

[project.scripts]
watchdog = "watchdog.cli:main"

[project.urls]
Homepage   = "https://github.com/tomcardoso/watchdog"
Repository = "https://github.com/tomcardoso/watchdog"
Issues     = "https://github.com/tomcardoso/watchdog/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/watchdog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Conservative, correctness-focused set: pyflakes (F) for real errors like unused
# imports/vars plus the pycodestyle logical-error subsets (E4/E7/E9). Line-length
# (E501) and import sorting (I) are intentionally not enforced — this project does
# not adopt an autoformatter or import reordering here, only correctness lint.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# cli.py deliberately re-imports a wide surface (registry/vault/setup helpers)
# purely so tests can reach them via `watchdog.cli.<name>` for monkeypatching —
# the same rationale as the `# noqa` on `import sys` at the top of that file.
# These are intentional re-exports, not dead imports, so F401 is exempt here.
"src/watchdog/cli.py" = ["F401"]

