# Every model Watchdog can call, by exact id. `name` is the pretty display form printed by the
# CLI/usage logging (falls back to the raw id if a model or an old, no-longer-catalogued id has
# none — see model_catalog.py's display_name). `tier` (Claude only) is the short name(s) that
# model settings accept in place of the raw id — a scalar for a model with one name, or a list of
# aliases when it has more than one (Sonnet 5.5's `[sonnet, sonnet-5.5]`: bare `sonnet` is the
# name a setting uses, `sonnet-5.5` the explicit, version-pinned alias to the same id; the first
# alias is what the Settings picker stores — see D165, D236, D249, D310) — the only place that
# mapping lives. A Claude model with no `tier` cannot be selected at all, since a Claude stage
# accepts only a tier name. `cache_write`/`cache_read` (Claude) vs `cached_input`
# (everyone else) reflect the two providers' different cache-pricing shapes — see
# model_client.py's _api_cost / _openai_cost for how each is applied. An OpenAI model may ALSO
# carry `cache_write` (#586, D195): the GPT-5.6 family and later bill cache writes at 1.25x the
# uncached input rate ("cache writes are billed at 1.25x the uncached input token rate and
# reported in `cache_write_tokens`" — developers.openai.com/api/docs/guides/prompt-caching,
# fetched 2026-08-11), where every earlier family carried no additional fee for a write. Omit it
# there: `_openai_cost` then leaves those tokens in the plain uncached-input remainder, which is
# what "no additional fee" means — not that they are free. `cache_breakpoints: true` marks that
# same family as needing EXPLICIT cache breakpoints on the wire — see the OpenAI entries below.
# Every OpenAI entry catalogued today belongs to that family; the earlier-family behaviour (no
# write fee, no breakpoint) is what an uncatalogued OpenAI id gets. `reasoning: true`
# marks an OpenAI model that accepts `reasoning_effort` and requires
# `max_completion_tokens` instead of `max_tokens`; omit it (defaults false) for every
# non-reasoning OpenAI model, and for every non-OpenAI provider (never consulted there).
# `effort_levels` (#518) is the source of truth for which `low`/`medium`/`high`/`xhigh`/`max`
# values of the abstract per-stage `effort` knob (D36) a model actually accepts — real coverage
# per model, not a per-provider flag: it varies across providers (Gemini stops at `high`, DeepSeek
# declares no `medium`) and has varied within one (Anthropic: "Not every model that supports `max`
# supports `xhigh`"). Omit it (defaults to none) for a model with no effort control at all; no
# catalogued model is one today. `model_client.py`'s
# `_resolve_effort` rejects a request for a level outside this list with a clear error rather
# than silently dropping it or sending a request the API would reject.
# `thinking: true` (Claude only, #635) marks a model that ships with extended thinking OFF by
# default — Anthropic's `thinking` parameter is a separate on/off switch from `effort`, which only
# tunes depth once thinking is (or isn't) engaged, and `effort` alone never turns it on. Sonnet 4.6
# and Opus 4.8 were off by default and declared it; every Claude model catalogued today ships with
# adaptive thinking already on, so none declares the field — `model_client.py` only sends the
# `thinking` param when this flag is true, leaving a model's native default untouched. The field
# stays for a future model that ships with thinking off. See D206, D310.
# `tokenizer_ratio` (#574, remeasured #617) is the actual-tokens-per-estimated-token multiplier
# for a model whose tokenizer isn't the one `pipeline/section.py`'s chars/4 `est_tokens` heuristic
# was calibrated against. `model_client.tokenizer_ratio` resolves it; `section.model_defaults`
# divides its window-derived threshold/budget by it so a document's real token footprint still
# respects the model's real context window.
#
# MEASURED, not quoted (#617, D198). EVERY value below comes from `benchmarks/tokenizer_ratio.py`
# run against corpus-v1 (6 documents, 209 pages, 160,031 est tokens) on 2026-08-15, against the
# corpus's chewed markdown assembled exactly as `orchestrate._pages_text` assembles it for a real
# call, with message framing subtracted out. It is the ratio of the provider's own count to
# `est_tokens` over the same pages' raw markdown — the pair sectioning actually reasons about.
# Two measurement routes, because the providers differ in what they expose:
#   * Anthropic and Gemini have free, non-generative counters (`messages.count_tokens`,
#     `models/<id>:countTokens`). Measured on the whole corpus, free. Rerun any time.
#   * OpenAI and DeepSeek have none, so they were measured by a BILLED differential probe
#     (`--probe`): a one-character baseline call plus one sample call, subtracted. Measured on a
#     12,028-est-token strided sample rather than the whole corpus, and ~$0.11 to reproduce.
#     Do not reach for tiktoken instead — as of 2026-08-15 it cannot map a single GPT-5.x id in
#     this catalog (`encoding_for_model("gpt-5.4-mini")` raises), and it is wrong for Claude.
#
# The measurement replaces #574's vendor citation, which was Anthropic's "approximately 30% more
# tokens for the same text" for Claude 4.7+ and an unmeasured 1.0 for everyone else. That figure
# turned out close but not exact on our text: 1.28, not 1.30. Relative to Claude's *old* tokenizer
# the new one runs ~37% heavier here (1.278/0.931), not 30% — a vendor statement about general
# prose, measured against chewed court filings and institutional financial reports.
#
# The ratio is a property of the TOKENIZER, not the model, confirmed on all four providers: every
# model within a family returned byte-identical counts. Haiku 4.5 = Sonnet 4.6 (the old Claude
# tokenizer, 0.93); Opus 4.8 = Sonnet 5 (the new one, 1.28); all three Gemini entries then
# catalogued; all six GPT-5.x entries then catalogued (9,558 tokens each on the sample); both
# DeepSeek V4 entries (9,656). FOUR tokenizers cover every model measured. A new model joining an
# existing family can copy its family's value; a genuinely new tokenizer needs its own run.
#
# Most of the models measured have since left the catalog (D310), so most entries here carry a
# COPIED family value: every Claude entry (Haiku 5.5's is derived instead, see its note), every
# GPT-6 entry, every Gemini entry and `deepseek-flash`. Only `gpt-5.6-luna` and `deepseek-v4-pro`
# are ids that were measured themselves. The CLAUDE.md Standing Follow-ups list the copied ones.
#
# The Claude/Gemini values are corpus-wide (est-token-weighted), not per-document means, and the
# per-document spread is real: 0.902-1.146 (old Claude), 1.243-1.703 (new Claude), 0.847-1.074
# (Gemini). Within-model spread exceeds between-model spread, so #617 asked whether a single
# scalar is the wrong shape. It is not, because the spread is size-dependent — the high end is
# always the 5-page Pension Order, and a document that small is never sectioned and can never
# approach a window. Weighting by est tokens puts the weight on the long documents, which are the
# only ones that can overrun. The tail is covered structurally besides: `_THRESHOLD_FRACTION` is
# 0.6, so a threshold-sized call built at the corpus ratio still lands at 60% of the window, and
# even at the worst measured per-document ratio it reaches only ~80%.
#
# The OpenAI/DeepSeek figures carry one extra step, since the probe could only afford a slice: the
# same strided sample was also counted for free on Claude and Gemini, where it reads 0.1-1.8% LOW
# against those models' whole-corpus ratios. The raw sample ratios (0.795 OpenAI, 0.803 DeepSeek)
# are nudged up by that ~1% and rounded — 0.80 and 0.81. Rounding up is the conservative
# direction here, since a smaller ratio widens the budget.
#
# A value BELOW 1.0 means chars/4 over-estimates for that tokenizer, and widens the budget
# accordingly. Every provider but Claude-4.7+ lands there, so this is the common case, not an edge
# one. It is safe for the same 40%-headroom reason — but it is also why every value here is a
# measurement of OUR corpus. A corpus of very different text (non-English, heavy code, dense
# tables throughout) could tokenize meaningfully worse; re-measure rather than assuming these
# transfer.
# Price reference (#574): https://github.com/pydantic/genai-prices — Pydantic's maintained price
# dataset (~34 providers). Consult it when adding or revising a model, but read the schema
# carefully: a price can be a LIST of clauses gated by `constraint.start_date` (take the clause
# whose date has passed, not the last one in the list), and an individual value can be a
# `{base, tiers}` object rather than a scalar. Both have produced a false "our catalog is wrong"
# reading before — resolve them before trusting a surface diff against this file.
# The dataset also goes stale in a way a diff won't show: its DeepSeek V4 rows still carried the
# pre-2026-08-16 prices days after DeepSeek itself published the increase, so a provider's own
# page is the authority when the two disagree, not the tie-breaker.
# Speaking of tiers: this catalog prices every model at one flat rate PER LENGTH and does not model
# context-length pricing tiers. It doesn't have to, because `long_context_threshold` keeps every
# call below the length where any tier would kick in — see the next paragraph. Two boundaries are
# known here: every OpenAI entry reprices the whole request above 272K tokens, and Claude Haiku 5.5
# above 100K.
#
# `price_periods` (D217) is the one axis this catalog DOES model, because no clamp can dodge it:
# a rate that varies by the CLOCK. A model that declares it prices at the entry's own `input`/
# `output`/`cached_input`/`cache_write` rates most of the time, and at those rates times a window's
# `multiplier` while the clock is inside that window. Shape:
#
#     price_periods:
#       - {from: "01:00", to: "04:00", multiplier: 2.0, days: [mon, tue, wed, thu, fri]}
#
# `days` is optional (D250): omit it and the window applies every day; list weekday names
# (`mon`..`sun`) and it applies only on those days. DeepSeek's peak is Monday-Friday only, with
# Chinese public holidays also off-peak — the weekdays are modelled, the holidays are not (that
# would need a holiday calendar), so a holiday is still priced at the peak rate here, an
# over-estimate and the safe direction.
#
# Times are 24-hour **UTC** always, and so are the days — a provider publishing local hours must be
# converted here, at authoring time, so nothing downstream has to carry a timezone. Each window is half-open,
# `[from, to)`: a call landing exactly on `to` is outside it. A window whose `from` is later than
# its `to` wraps midnight (`22:00`->`02:00`). Windows are matched in order and the first hit wins;
# outside all of them the multiplier is 1.0, so the rates in the entry are the CHEAP rates and a
# window only ever names the exception. Declaring the cheap side as the base is deliberate: a model
# that later drops the scheme reverts to correct flat pricing by deleting the field.
#
# `model_catalog.price_multiplier()` resolves it against the current UTC time (or an explicit one),
# and `model_client`'s `_api_cost`/`_openai_cost` apply it to the finished per-call figure — so a
# call is billed at the rate in force WHEN IT RAN, which is also why nothing recomputes an archived
# call's cost later (`cmd/usage.py` reads the stored `cost_usd` and never re-prices it). The
# pre-flight estimates (`--estimate-all`, `benchmarks/cost_reference.fallback_estimate`) apply the
# same multiplier for the moment they are asked, and mark the affected rows: a long run that
# crosses a window boundary is billed on both sides of it, which no single-figure estimate can say.
#
# `long_context_threshold` (#555, D202) is the real-token input length at/above which a model bills
# at a higher rate. `pipeline/section.py` clamps BOTH the sectioning threshold and the per-section
# budget to it (under `_LONG_CONTEXT_HEADROOM`), so no single extraction call is ever planned past
# the boundary. It exists because D202 deleted the old output-derived clamp that had been holding
# these models a factor of five under the line by accident: sizing from the context window alone
# gives a 1.05M-window OpenAI model a 393,750 est-token budget — about 315,000 real tokens at the
# 0.80 ratio, comfortably PAST 272K — and a whole-document threshold larger still. Without the
# clamp a long document bills at the upper tier while `--estimate-all`, which prices flat, quotes
# the lower one: a ~2x understatement on the affected calls. Omit the field entirely for a model
# that prices flat (every Claude entry but Haiku 5.5, every DeepSeek and Gemini entry).
#
# **Both boundaries are vendor-cited, fetched 2026-10-13.** OpenAI
# (developers.openai.com/api/docs/models/<id>): "Prompts with more than 272K input tokens are
# priced at 2x input and cache rates and 1.5x output for the full request" — the higher rate
# applies to the ENTIRE request, not just the tokens past the line. Crossing by one token reprices
# the whole call, which is why the clamp is strict rather than approximate. Anthropic
# (platform.claude.com/docs/en/about-claude/pricing#long-context-pricing): "a request whose prompt
# is over 100,000 tokens pays higher prices" on Haiku 5.5, counting cache reads and writes.
#
# `_LONG_CONTEXT_HEADROOM` (10%, the same convention `_OUTPUT_HEADROOM` already uses for
# `max_output_tokens`) covers the per-call prompt scaffolding that rides on top of the document
# text `section.py` sizes, which cannot yet be measured directly: `est_prompt_tokens` landed in
# #617 and no run has happened since, so zero archived records carry it. Add the field to any new
# tiered model — and note the boundary is a property of the model, not the family: Haiku 5.5 is the
# only Claude model with one.
#
# The same caveat applies, as it always did, to a user who pins an absolute
# `section_token_threshold`: `_resolve_override` honours a literal int as-is and does NOT rescale
# it against the model's real window or this boundary (see its docstring).
# `max_output_tokens` is the maximum tokens a model will emit in one non-batch response, per each
# provider's own docs (re-fetched 2026-10-13). Every provider catalogued here draws
# reasoning/thinking tokens from this SAME budget when a model reasons — Claude's extended/adaptive
# thinking, OpenAI's reasoning_effort, Gemini's thinking_level, DeepSeek's thinking mode all bill
# that content as regular output, never additional to this ceiling. Anthropic
# (platform.claude.com/docs/en/build-with-claude/thinking): "the tokens Claude spends reasoning are
# billed as output tokens ... and they count toward max_tokens". OpenAI
# (developers.openai.com/api/docs/guides/reasoning): "you can limit the total number of tokens the
# model generates, including reasoning tokens ... by using the max_output_tokens parameter".
# Gemini (ai.google.dev/gemini-api/docs/pricing) bills output "(including thinking tokens)".
# DeepSeek publishes no separate figure for its thinking mode at all (see below) — its one
# documented ceiling covers both modes. Per-provider figures: Anthropic
# (platform.claude.com/docs/en/about-claude/models/overview) — 128,000 for every Claude entry.
# `max_output_tokens_batch` (Anthropic only, 300,000) is the higher ceiling reachable with the
# `output-300k-2026-03-24` beta header
# (platform.claude.com/docs/en/build-with-claude/batch-processing#extended-output-beta) — Message
# Batches API only, not the synchronous calls this client makes; omitted for every non-Anthropic
# model (no documented equivalent). OpenAI (developers.openai.com/api/docs/models/<id>): a flat 128,000
# across every GPT-5.6 and GPT-6 model in this catalog. Gemini
# (ai.google.dev/gemini-api/docs/models/<id>): a flat 65,536 across every model in this catalog
# (Gemini 4 Argon's default synchronous figure; its "long decode" mode is not used). DeepSeek
# (api-docs.deepseek.com/quick_start/pricing/): 384,000 for both Flash and Pro, thinking on or off
# — supersedes model_client.py's former
# `_DEEPSEEK_THINKING_MAX_TOKENS = 48000`, whose cited source page
# (api-docs.deepseek.com/guides/reasoning_model) had been repurposed to unrelated content and no
# longer documented that 32K/64K figure. #598 removed that constant along with model_client.py's
# other per-provider reserve tables, deriving the wire ceiling from this field instead — the
# 384,000 DeepSeek figure above is taken from DeepSeek's own docs but not yet corroborated by a
# live call (see DECISIONS D197). No provider catalogued here documents a separate streaming
# ceiling (distinct from the Anthropic batch case above).
models:
  # Each provider's current frontier models only (D310): a model its vendor has superseded leaves
  # the catalog unless something still needs it, and nothing keeps an older id resolving (D301).
  # Flagship-class models are left out too (D311, D312): Claude Opus 5.5 and Fable 5.1, GPT-6
  # Astra and GPT-6.1 Sol are more capable, and more expensive, than Watchdog's stages need.
  # Claude entries come first, in the order the Settings picker lists them: haiku, sonnet.
  # Every Claude figure below is from platform.claude.com/docs/en/about-claude/models/overview,
  # .../about-claude/pricing and .../build-with-claude/effort, fetched 2026-10-13. Both list a 1M
  # context window, pinned to 200K here (D89), and 128K output. Both have adaptive thinking on by
  # default, so neither declares `thinking` (D206), and both take all five effort levels. The API's
  # own default effort, used when Watchdog sends none, is `medium` on Haiku 5.5 and `high` on
  # Sonnet 5.5.
  #
  # Claude Haiku 5.5 — the bare `haiku` default since 2026-10-09 (D277). Two rate cards chosen by
  # prompt length: $0.10 / $0.50 per MTok up to 100,000 input tokens, $0.50 / $2.50 above (the whole
  # request, cache reads and writes included); cache reads 0.1x input, 5-minute cache writes 1.25x.
  # `long_context_threshold` keeps every planned call under 100K so only the lower card applies,
  # as for the OpenAI entries (D202). 300K output on the Message Batches beta (listed in the
  # overview's max-output note, fetched 2026-10-13). `tokenizer_ratio` is DERIVED, not measured:
  # Anthropic says this tokenizer counts the same text as about 30% more tokens than Haiku 4.5's,
  # so 0.93 x 1.3 = 1.21 — see the CLAUDE.md Standing Follow-ups.
  - id: claude-haiku-5-5
    name: Claude Haiku 5.5
    provider: anthropic
    tier: [haiku, haiku-5.5]
    input: 0.10e-6
    output: 0.50e-6
    cache_write: 0.125e-6
    cache_read: 0.01e-6
    context_window: 200_000
    max_output_tokens: 128_000
    max_output_tokens_batch: 300_000
    effort_levels: [low, medium, high, xhigh, max]
    tokenizer_ratio: 1.21     # derived from "about 30% more tokens" than Haiku 4.5; unmeasured
    long_context_threshold: 100_000   # $0.50 / $2.50 above this, whole request
  # Claude Sonnet 5.5 — the bare `sonnet` default since 2026-10-01 (D236). $2 / $10 per MTok, 5m
  # cache write $2.50, cache read $0.10: 0.05x input (corrected 2026-10-13 from
  # $0.20, which over-stated every cache read by 2x). `tokenizer_ratio` is COPIED from the new
  # Claude tokenizer's measured value (#617), unmeasured for this id — see the Standing Follow-ups.
  - id: claude-sonnet-5-5
    name: Claude Sonnet 5.5
    provider: anthropic
    tier: [sonnet, sonnet-5.5]
    input: 2.0e-6
    output: 10.0e-6
    cache_write: 2.5e-6
    cache_read: 0.10e-6
    context_window: 200_000
    max_output_tokens: 128_000
    max_output_tokens_batch: 300_000
    effort_levels: [low, medium, high, xhigh, max]
    tokenizer_ratio: 1.28     # copied from the new Claude tokenizer (#617), unconfirmed for this id

  # DeepSeek (1M-token window; a cache hit costs 1/50 of a miss on Flash, 1/30 on Pro).
  # Re-verified against api-docs.deepseek.com/quick_start/pricing on 2026-10-13: `deepseek-flash`
  # serves DeepSeek-V4.1-Flash and `deepseek-v4-pro` serves DeepSeek-V4-Pro-0813; 1M context and
  # 384K maximum output for both; peak hours 01:00-04:00 and 06:00-10:00 UTC, Monday to Friday,
  # with Chinese public holidays off-peak in full.
  #
  # PEAK/OFF-PEAK since 16:00 UTC on 2026-08-16 (D217). The rates below are the OFF-PEAK ones, per
  # `price_periods`' base-is-the-cheap-rate convention above; peak is exactly 2x on every column,
  # which is DeepSeek's own framing ("off-peak rates are half of the peak rates"). Every archived
  # benchmark and usage figure from before that date understates what the same run costs today —
  # see DECISIONS D217 and benchmarks/FINDINGS.md.
  #
  # `effort_levels`: thinking mode takes low/high/max (DeepSeek added `reasoning_effort` on
  # 2026-08-13). `medium` and `xhigh` are deliberately NOT declared even though the API accepts
  # them, because DeepSeek documents them as aliases — api-docs.deepseek.com/guides/thinking_mode
  # maps `medium`->high and `xhigh`->high — and this field exists to make a level a user asks for
  # either happen or fail loudly, not silently become a different one. The practical effect of
  # leaving `medium` out is that the implicit `medium` extractor default is skipped on DeepSeek, so
  # a DeepSeek run thinks at the provider's own default, `high`, unless something asks for
  # `low`/`max` explicitly. The levels reach only the `-thinking` ids — `reasoning_effort` tunes how
  # deeply the model thinks, so with thinking off there is nothing for it to tune, and
  # `model_client._effort_levels` reports no levels at all for a plain id.
  #
  # Flash was renamed and repriced on 2026-10-04 (D250): DeepSeek retired V4 Flash and serves
  # V4.1 Flash as `deepseek-flash`. The V4.1 checkpoint's tokenizer has not been measured; the V4
  # value is copied.
  - id: deepseek-flash
    name: DeepSeek V4.1 Flash
    provider: deepseek
    input: 0.15e-6
    output: 0.60e-6
    cached_input: 0.003e-6
    context_window: 1_000_000
    max_output_tokens: 384_000
    effort_levels: [low, high, max]
    tokenizer_ratio: 0.81     # copied from the V4 value (measured #617), unconfirmed for V4.1 (D250)
    price_periods: &deepseek_peak    # peak hours, UTC, Mon-Fri only — 2x every rate above
      - {from: "01:00", to: "04:00", multiplier: 2.0, days: [mon, tue, wed, thu, fri]}
      - {from: "06:00", to: "10:00", multiplier: 2.0, days: [mon, tue, wed, thu, fri]}
  - id: deepseek-v4-pro
    name: DeepSeek V4 Pro
    provider: deepseek
    input: 0.66e-6
    output: 1.98e-6
    cached_input: 0.022e-6
    context_window: 1_000_000
    max_output_tokens: 384_000
    effort_levels: [low, high, max]
    tokenizer_ratio: 0.81     # measured #617, corpus-v1 2026-08-15 (DeepSeek V4 tokenizer)
    price_periods: *deepseek_peak    # same windows as Flash — one schedule, both models

  # OpenAI: GPT-6 Luna and GPT-5.6 Luna, standard tier. Every figure is from
  # developers.openai.com/api/docs/models/<id> and .../api/docs/pricing, fetched 2026-10-13. Both: 1,050,000-token window (922,000 maximum input), 128,000 output, and the
  # same whole-request long-context boundary — "Prompts with more than 272K input tokens are
  # priced at 2x input and cache rates and 1.5x output for the full request" — so every entry
  # carries `long_context_threshold: 272_000` (D202). Both are GPT-5.6-or-later, so cache writes
  # bill at 1.25x the uncached input rate and caching needs explicit breakpoints
  # (developers.openai.com/api/docs/guides/prompt-caching: both apply to "GPT-5.6 and later"),
  # hence `cache_write` and `cache_breakpoints` on both. `reasoning.effort` also accepts `none`
  # on Luna, which the abstract effort knob has no level for, so it is not listed. The GPT-6
  # tokenizer has not been measured: GPT-6 Luna's `tokenizer_ratio` is COPIED from the GPT-5.x value
  # (#617) — see the Standing Follow-ups.
  #
  # Left out on purpose: GPT-6 Astra ($10 / $50) and GPT-6.1 Sol ($2 / $10), flagship-class
  # (D311); `gpt-6-sol`, superseded by GPT-6.1 Sol (D310); GPT-5.6 Sol and Terra, and
  # GPT-5.5/5.4/5.4-mini, superseded by the GPT-6 family (D310).
  #
  # GPT-6 Luna — "Our most efficient model for focused, high-volume tasks". Default effort `medium`.
  - id: gpt-6-luna
    name: GPT-6 Luna
    provider: openai
    input: 0.10e-6
    output: 0.50e-6
    cached_input: 0.01e-6
    cache_write: 0.125e-6     # 1.25x uncached input
    cache_breakpoints: true
    context_window: 1_050_000
    max_output_tokens: 128_000
    reasoning: true
    effort_levels: [low, medium, high, xhigh, max]
    tokenizer_ratio: 0.80     # copied from the GPT-5.x value (#617), unconfirmed for GPT-6 (D249)
    long_context_threshold: 272_000   # 2x input and cache / 1.5x output above this, whole request
  # GPT-5.6 Luna — kept, though GPT-6 Luna supersedes it at half the price, because the Settings
  # help and docs/configuration.md recommend it as the alternative extractor and classifier on the
  # strength of archived benchmark figures measured on it (D249, D310). It is still on OpenAI's
  # pricing page and is not deprecated. Remove it once that recommendation is re-measured.
  - id: gpt-5.6-luna
    name: GPT-5.6 Luna
    provider: openai
    input: 0.20e-6
    output: 1.20e-6
    cached_input: 0.02e-6
    cache_write: 0.25e-6      # 1.25x uncached input
    cache_breakpoints: true
    context_window: 1_050_000
    max_output_tokens: 128_000
    reasoning: true
    effort_levels: [low, medium, high, xhigh, max]
    tokenizer_ratio: 0.80     # measured #617, corpus-v1 2026-08-15 (shared GPT-5.x tokenizer)
    long_context_threshold: 272_000   # 2x input and cache / 1.5x output above this, whole request

  # Gemini, standard paid tier. Every figure is from ai.google.dev/gemini-api/docs/pricing,
  # .../docs/models/<id>, .../docs/thinking and .../docs/deprecations, fetched 2026-10-13. Thinking
  # cannot be turned off on any of these; each takes the thinking levels low, medium and high
  # (Flash-Lite also `minimal`, which the abstract effort knob has no level for). Gemini 2.5 is
  # deliberately not catalogued (#583, D182). The pricing page lists no prompt-length tier for any
  # of the three, so none carries `long_context_threshold`. Google gives a 1,048,576-token window;
  # this catalog uses 1,000,000 for every Gemini entry.
  #
  # Removed (D310): `gemini-3.7-flash`, which Google now routes to `gemini-3.8-flash` ("the endpoint
  # is not shutting down and automatically routes API requests to gemini-3.8-flash", deprecations
  # page), and `gemini-3.1-pro-preview`, a preview Google can retire on short notice, superseded by
  # Gemini 4 Argon as the flagship.
  #
  # DATED PRICE CHANGES. Two of these rows carry a price that changes on a calendar date. This
  # catalog has no dated-price mechanism (`price_periods` models a rate that cycles with the clock,
  # not a one-way change), so a human changes the numbers on the day — see the CLAUDE.md Standing
  # Follow-ups. Until then the catalog prices those calls at the old rate.
  #
  # `tokenizer_ratio` is copied from the Gemini family value (#617), not re-measured for any of
  # these ids. Gemini's token counter is free: `benchmarks/tokenizer_ratio.py --count` re-measures
  # them against corpus-v1 for $0.
  #
  # Gemini 4 Argon — Google's "flagship reasoning model", stable, default thinking `medium`. Its
  # context window is "unified input and output": 1,048,576 tokens shared between the prompt and the
  # answer. Output is 65,536 by default; the "long decode" mode that reaches 1M output is not used
  # here. Context caching is implicit only.
  - id: gemini-4-argon
    name: Gemini 4 Argon
    provider: gemini
    input: 2.00e-6            # through 2026-11-30; $4.00e-6 from 2026-12-01
    output: 10.0e-6           # through 2026-11-30; $20.0e-6 from 2026-12-01
    cached_input: 0.10e-6     # through 2026-11-30; $0.20e-6 from 2026-12-01
    context_window: 1_000_000
    max_output_tokens: 65_536
    effort_levels: [low, medium, high]
    tokenizer_ratio: 0.91     # Gemini family value (#617); not independently measured for this id
  # Gemini 3.8 Flash — "Most intelligent Flash model", stable, default thinking `medium`. Its rates
  # are PROMOTIONAL through 2026-12-31 and double on 2027-01-01.
  - id: gemini-3.8-flash
    name: Gemini 3.8 Flash
    provider: gemini
    input: 0.75e-6            # promotional through 2026-12-31; $1.50e-6 from 2027-01-01
    output: 3.75e-6           # promotional through 2026-12-31; $7.50e-6 from 2027-01-01
    cached_input: 0.075e-6    # promotional through 2026-12-31; $0.15e-6 from 2027-01-01
    context_window: 1_000_000
    max_output_tokens: 65_536
    effort_levels: [low, medium, high]
    tokenizer_ratio: 0.91     # Gemini family value (#617); not independently measured for this id
  # Gemini 3.5 Flash-Lite — the cheapest Gemini tier, stable, no shutdown date announced.
  - id: gemini-3.5-flash-lite
    name: Gemini 3.5 Flash-Lite
    provider: gemini
    input: 0.30e-6
    output: 2.50e-6
    cached_input: 0.03e-6
    context_window: 1_000_000
    max_output_tokens: 65_536
    effort_levels: [low, medium, high]
    tokenizer_ratio: 0.91     # Gemini family value (#617); not independently measured for this id

# Context-window fallback, consulted by model_client.py's context_window() only when a model
# isn't an exact match in the `models` catalog above — an unpriced local/OpenRouter model (whose
# id an operator picked themselves) or a real provider id shipped after this catalog was last
# updated. Matched by SUBSTRING anywhere in the model id (not just a prefix), MOST SPECIFIC FIRST
# — list order is the match order, so `deepseek-v4` must sit above the broader `deepseek` row or
# every DeepSeek id would wrongly get the legacy 128K figure. This number directly controls
# document sectioning (`pipeline/section.py`): too small and a document gets needlessly chopped
# into more, smaller extraction calls; too large and a single call can overrun the model's real
# window and fail outright. A model matching nothing here falls through to
# model_client.py's `_DEFAULT_CONTEXT_WINDOW` (128K) as a final, conservative catch-all. Verbatim
# from the old `_CONTEXT_WINDOWS` table. There is deliberately no `gpt-6` row (D310): a GPT-6 id
# that isn't catalogued has no `long_context_threshold` either, so a 1.05M window would plan calls
# past the 272K line where OpenAI reprices the whole request; the 128K default stays under it.
context_window_fallback:
  - [deepseek-v4, 1_000_000]
  - [deepseek-flash, 1_000_000]   # V4.1 Flash — its `-thinking` form is not an exact catalog id
  - [deepseek, 128_000]       # legacy deepseek-chat/reasoner, pre-V4
  - [gemini-2.5, 1_000_000]
  - [gemini-3, 1_000_000]
  - [gpt-5.6, 1_050_000]
  - [gpt-5, 400_000]
  - [gpt-4, 128_000]
  - [o1, 200_000]
  - [o3, 200_000]
  - [o4, 200_000]
  - [claude, 200_000]         # every Claude tier shares this 200K usable window

# Output-cap fallback, consulted by model_client.py's `_output_envelope()` only when a model isn't
# an exact match in the `models` catalog above (same uncatalogued-model cases as
# context_window_fallback). Matched by SUBSTRING anywhere in the model id, MOST SPECIFIC FIRST —
# list order is the match order, exactly as in context_window_fallback. Without this table an
# uncatalogued model falls back to model_client.py's conservative `_DEFAULT_MAX_OUTPUT_TOKENS`,
# which for a *reasoning* model is far too small: chain-of-thought and the visible answer share
# this one budget, and sectioning inverts the resulting ceiling into an input budget, so a
# too-small cap collapses that budget and shreds a document into many tiny sections (#598).
#
# Every figure here is one of the per-family flats already cited in the `max_output_tokens` comment
# at the top of this file — this table only extends those documented family-wide values to ids the
# catalog doesn't list yet (an OpenAI or Gemini model shipped after this file was last updated).
# Families deliberately OMITTED, so they keep the conservative default rather than an over-claim:
#   * `claude`  — this table only fires for an *uncatalogued* Claude id, which by definition means
#                 an old or third-party-routed one (e.g. `anthropic/claude-3.5-sonnet` via
#                 OpenRouter, real cap 8,192). Claiming 128,000 there could exceed the real cap.
#   * `gpt-4`   — gpt-4o's real cap (16,384) is close enough to the default that the default fits.
#   * `o1`/`o3`/`o4` — no citation in this repo, and #598 is specifically about not guessing.
#   * legacy `deepseek` (pre-V4) — low real cap; the default is the right direction to be wrong in.
max_output_tokens_fallback:
  - [gpt-6, 128_000]          # every GPT-6 model page, gpt-6-sol included (fetched 2026-10-13)
  - [gpt-5, 128_000]
  - [gemini, 65_536]
  - [deepseek-v4, 384_000]
  - [deepseek-flash, 384_000]

# Reasoning-model fallback, consulted by model_client.py's _openai_is_reasoning() only when a
# model isn't an exact match in the `models` catalog above (same uncatalogued-model cases as
# context_window_fallback). Decides whether to send `max_completion_tokens` (reasoning models) or
# the classic `max_tokens` (chat models) — sending the wrong one gets the request rejected
# outright by the provider — and, since an uncatalogued id has no `effort_levels` entry either,
# doubles as the effort fallback: a reasoning model gets the conservative `low`/`medium`/`high`
# (never `xhigh`/`max` — unconfirmed for an id not explicitly catalogued), a chat model gets none.
# Matched by PREFIX only (model id startswith, not substring), MOST SPECIFIC FIRST. No two
# prefixes here can actually collide today (a `gpt-4...` id can't also start with `gpt-5`), so
# ordering isn't load-bearing yet the way it is in context_window_fallback — but keep declaring a
# chat-family override (like `gpt-4`/`chatgpt`) above any broader family row it should take
# priority over, so that stays true if a future addition ever does overlap. A model matching
# nothing here defaults to `false` (chat) — the safe direction, since sending a reasoning-only
# parameter to a chat model risks a 400, while withholding it from an actual reasoning model
# merely gives up the effort knob. From the old `_OPENAI_MODEL_CAPS` table, plus `gpt-6` (D310).
reasoning_fallback:
  - [gpt-4, false]    # gpt-4o / gpt-4.1 / gpt-4-turbo — chat
  - [chatgpt, false]  # chat-latest — chat
  - [gpt-6, true]     # entire GPT-6 family reasons (each page lists `reasoning.effort`)
  - [gpt-5, true]     # entire GPT-5 family reasons
  - [o1, true]
  - [o3, true]
  - [o4, true]
