# Every model Watchdog can call, by exact id. `name` is the pretty display form printed by the
# CLI/usage logging (falls back to the raw id if a model or an old, no-longer-catalogued id has
# none — see model_catalog.py's display_name). `tier` (Claude only) is the short name(s) that
# `--model`/config accept in place of the raw id — a scalar (haiku, opus) for a model with one
# name, or a list of aliases when it has more than one (Sonnet 4.6's `[sonnet, sonnet-4.6]`: bare
# `sonnet` keeps resolving to 4.6 as the default, `sonnet-4.6` is the explicit, version-pinned
# alias to the same id — see D165) — the only place that mapping lives. `cache_write`/`cache_read` (Claude) vs `cached_input`
# (everyone else) reflect the two providers' different cache-pricing shapes — see
# model_client.py's _api_cost / _openai_cost for how each is applied. An OpenAI model may ALSO
# carry `cache_write` (#586, D195): the GPT-5.6 family and later bill cache writes at 1.25x the
# uncached input rate ("cache writes are billed at 1.25x the uncached input token rate and
# reported in `cache_write_tokens`" — developers.openai.com/api/docs/guides/prompt-caching,
# fetched 2026-08-11), where every earlier family carried no additional fee for a write. Omit it
# there: `_openai_cost` then leaves those tokens in the plain uncached-input remainder, which is
# what "no additional fee" means — not that they are free. `cache_breakpoints: true` marks that
# same family as needing EXPLICIT cache breakpoints on the wire — see the field's own note on the
# gpt-5.6 entries below. `reasoning: true`
# marks an OpenAI model that accepts `reasoning_effort` and requires
# `max_completion_tokens` instead of `max_tokens`; omit it (defaults false) for every
# non-reasoning OpenAI model, and for every non-OpenAI provider (never consulted there).
# `effort_levels` (#518) is the source of truth for which `low`/`medium`/`high`/`xhigh`/`max`
# values of the abstract per-stage `effort` knob (D36) a model actually accepts — real coverage
# per model, not a per-provider flag: it varies within a provider (Claude Sonnet 4.6 takes `max`
# but not `xhigh`; Opus 4.8 takes both) as much as it does across providers. Omit it (defaults to
# none) for a model with no effort control at all (Claude Haiku, DeepSeek). `model_client.py`'s
# `_resolve_effort` rejects a request for a level outside this list with a clear error rather
# than silently dropping it or sending a request the API would reject.
# `tokenizer_ratio` (#574, remeasured #617) is the actual-tokens-per-estimated-token multiplier
# for a model whose tokenizer isn't the one `pipeline/section.py`'s chars/4 `est_tokens` heuristic
# was calibrated against. `model_client.tokenizer_ratio` resolves it; `section.model_defaults`
# divides its window-derived threshold/budget by it so a document's real token footprint still
# respects the model's real context window.
#
# MEASURED, not quoted (#617, D197). Every value below comes from `benchmarks/tokenizer_ratio.py`
# run against corpus-v1 (6 documents, 209 pages, 160,031 est tokens) on 2026-08-15, using each
# provider's own free, non-generative token counter — Anthropic's `messages.count_tokens`, Gemini's
# `models/<id>:countTokens` — on the corpus's chewed markdown assembled exactly as
# `orchestrate._pages_text` assembles it for a real call, with message framing subtracted out. It
# is the ratio of that count to `est_tokens` over the same pages' raw markdown, which is the pair
# sectioning actually reasons about. Rerun the script to reproduce; it needs no extraction calls.
#
# The measurement replaces #574's vendor citation, which was Anthropic's "approximately 30% more
# tokens for the same text" for Claude 4.7+ and an unmeasured 1.0 for everyone else. That figure
# turned out close but not exact on our text: 1.28, not 1.30. Relative to Claude's *old* tokenizer
# the new one runs ~37% heavier here (1.278/0.931), not 30% — a vendor statement about general
# prose, measured against chewed court filings and institutional financial reports.
#
# The ratio is a property of the TOKENIZER, not the model. Haiku 4.5 and Sonnet 4.6 return
# byte-identical counts on all six documents; so do Opus 4.8 and Sonnet 5; so do all three Gemini
# entries. Three tokenizers cover seven models. A new model joining an existing family can copy
# its family's value; a genuinely new tokenizer needs its own run.
#
# Values are corpus-wide (est-token-weighted), not per-document means, and the per-document spread
# is real: 0.902-1.146 (old Claude), 1.243-1.703 (new Claude), 0.847-1.074 (Gemini). Within-model
# spread exceeds between-model spread, so #617 asked whether a single scalar is the wrong shape.
# It is not, because the spread is size-dependent — the high end is always the 5-page Pension
# Order, and a document that small is never sectioned and can never approach a window. Weighting
# by est tokens puts the weight on the long documents, which are the only ones that can overrun.
# The tail is covered structurally besides: `_THRESHOLD_FRACTION` is 0.6, so a threshold-sized
# call built at the corpus ratio still lands at 60% of the window, and even at the worst measured
# per-document ratio it reaches only ~80%.
#
# A value BELOW 1.0 means chars/4 over-estimates for that tokenizer, and widens the budget
# accordingly. That is deliberate and safe for the same 40%-headroom reason — but it is also why
# every value here is a measurement of OUR corpus. A corpus of very different text (non-English,
# heavy code, dense tables throughout) could tokenize meaningfully worse; re-measure rather than
# assuming these transfer.
#
# OPENAI AND DEEPSEEK ARE DELIBERATELY LEFT UNDECLARED (they default to 1.0). Neither provider
# exposes a free token counter, and tiktoken is not a substitute: as of 2026-08-15 it cannot map
# a single GPT-5.x id in this catalog (`encoding_for_model("gpt-5.4-mini")` raises), and it is
# simply wrong for Claude. What we do have is `benchmarks/tokenizer_ratio.py --history`, which
# regresses `actual = ratio * est + overhead` over archived benchmark calls; it puts every
# OpenAI/DeepSeek model at or below ~1.1, and the same regression run against Claude and Gemini
# reads ~12-17% HIGH versus their counted ground truth (the extraction prompt's harvested-
# candidate block scales with document size, so some per-token overhead is still landing in the
# slope). Corrected for that, all of them fall below 1.0 — meaning the 1.0 default is already on
# the conservative side, and raising the budget on a derived correction to a noisy fit
# (gpt-5.4-nano fits at r2 0.38) would be worse than the vendor figure this change removed.
# Declare a measured value here if OpenAI or DeepSeek ever ships a counting endpoint.
# Price reference (#574): https://github.com/pydantic/genai-prices — Pydantic's maintained price
# dataset (~34 providers). Consult it when adding or revising a model, but read the schema
# carefully: a price can be a LIST of clauses gated by `constraint.start_date` (take the clause
# whose date has passed, not the last one in the list), and an individual value can be a
# `{base, tiers}` object rather than a scalar. Both have produced a false "our catalog is wrong"
# reading before — resolve them before trusting a surface diff against this file.
# Speaking of tiers: this catalog prices every model at one flat rate and does not model
# context-length pricing tiers (several providers, incl. gpt-5.6-luna/-terra and gpt-5.4, roughly
# double their rate above ~272K tokens). That's deliberate, and currently harmless: section.py
# caps every real call's context far below that regardless — at most `_MAX_OUTPUT_CAPPED_BUDGET`
# (50,000 est tokens) on the output-ceiling-capped openai/gemini path, which the catalog-derived
# envelope now reaches routinely at low/medium effort (#598, D197) where the old 16K-based
# ceilings landed well under it. Still a factor of five under the ~272K threshold where these
# tiers begin, but the margin is thinner than it was. It stops being harmless if a user
# pins an absolute `section_token_threshold` in config: `_resolve_override` honours a literal int
# as-is and does NOT rescale it against the model's real window (see its docstring), so a value
# large enough could push a single call's context past a tier boundary — and then `--estimate-all`
# would understate that model's real cost. No enforcement for this; re-check the margin if you
# change sectioning defaults or add a tiered model.
# `max_output_tokens` is the maximum tokens a model will emit in one non-batch response, per each
# provider's own docs (all fetched 2026-08-10). Every provider catalogued here draws
# reasoning/thinking tokens from this SAME budget when a model reasons — Claude's extended/adaptive
# thinking, OpenAI's reasoning_effort, Gemini's thinking_level, DeepSeek's thinking mode all bill
# that content as regular output, never additional to this ceiling. Anthropic
# (platform.claude.com/docs/en/build-with-claude/thinking): "the tokens Claude spends reasoning are
# billed as output tokens ... and they count toward max_tokens". OpenAI
# (developers.openai.com/api/docs/guides/reasoning): "you can limit the total number of tokens the
# model generates, including reasoning tokens ... by using the max_output_tokens parameter".
# Gemini (ai.google.dev/gemini-api/docs/pricing) bills output "(including thinking tokens)".
# DeepSeek publishes no separate figure for its thinking mode at all (see below) — its one
# documented ceiling covers both modes. Per-provider figures: Anthropic
# (platform.claude.com/docs/en/about-claude/models/overview) — 64,000 for Haiku 4.5, 128,000 for
# Sonnet 4.6/Opus 4.8/Sonnet 5. `max_output_tokens_batch` (Anthropic only, 300,000) is the higher
# ceiling reachable with the `output-300k-2026-03-24` beta header
# (platform.claude.com/docs/en/build-with-claude/batch-processing#extended-output-beta) — Message
# Batches API only, not the synchronous calls this client makes; omitted for Haiku 4.5 (not
# eligible) and for every non-Anthropic model (no documented equivalent). OpenAI
# (developers.openai.com/api/docs/models/<id>, e.g. .../gpt-5.5): a flat 128,000 across every
# GPT-5.x model in this catalog. Gemini (ai.google.dev/gemini-api/docs/models/<id>): a flat 65,536
# across every model in this catalog. DeepSeek (api-docs.deepseek.com/quick_start/pricing/):
# 384,000 for both V4 Flash and Pro, thinking on or off — supersedes model_client.py's former
# `_DEEPSEEK_THINKING_MAX_TOKENS = 48000`, whose cited source page
# (api-docs.deepseek.com/guides/reasoning_model) had been repurposed to unrelated content and no
# longer documented that 32K/64K figure. #598 removed that constant along with model_client.py's
# other per-provider reserve tables, deriving the wire ceiling from this field instead — the
# 384,000 DeepSeek figure above is taken from DeepSeek's own docs but not yet corroborated by a
# live call (see DECISIONS D197). No provider catalogued here documents a separate streaming
# ceiling (distinct from the Anthropic batch case above).
models:
  # Order matches the old _MODEL_IDS table (haiku, sonnet, opus) — cmd/setup.py's interactive
  # picker lists Claude tiers in this insertion order, so preserving it keeps picker behavior
  # unchanged rather than silently reshuffling it.
  - id: claude-haiku-4-5
    name: Claude Haiku 4.5
    provider: anthropic
    tier: haiku
    input: 1.0e-6
    output: 5.0e-6
    cache_write: 1.25e-6
    cache_read: 0.10e-6
    context_window: 200_000
    max_output_tokens: 64_000
    tokenizer_ratio: 0.93     # measured #617, corpus-v1 2026-08-15 (old Claude tokenizer)
  - id: claude-sonnet-4-6
    name: Claude Sonnet 4.6
    provider: anthropic
    tier: [sonnet, sonnet-4.6]
    input: 3.0e-6
    output: 15.0e-6
    cache_write: 3.75e-6
    cache_read: 0.30e-6
    context_window: 200_000
    max_output_tokens: 128_000
    max_output_tokens_batch: 300_000
    effort_levels: [low, medium, high, max]
    tokenizer_ratio: 0.93     # measured #617, corpus-v1 2026-08-15 (old Claude tokenizer)
  - id: claude-opus-4-8
    name: Claude Opus 4.8
    provider: anthropic
    tier: opus
    input: 5.0e-6
    output: 25.0e-6
    cache_write: 6.25e-6
    cache_read: 0.50e-6
    context_window: 200_000
    max_output_tokens: 128_000
    max_output_tokens_batch: 300_000
    effort_levels: [low, medium, high, xhigh, max]
    tokenizer_ratio: 1.28     # measured #617, corpus-v1 2026-08-15 (new Claude tokenizer; was 1.3)
  # Claude Sonnet 5 (#361/#509 benchmark groundwork, D165) — additive alongside 4.6; bare `sonnet`
  # keeps resolving to 4.6 above, `sonnet-5` is the only way to select this entry. Pricing below is
  # the INTRODUCTORY rate, in effect through 2026-08-31 (source: platform.claude.com/docs/en/
  # about-claude/pricing, fetched 2026-08-03). Standard rate takes effect 2026-09-01 and is
