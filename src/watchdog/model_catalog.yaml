  # GPT-5.6 family (Sol/Terra/Luna) — same 1.05M window as gpt-5.4/5.5 (issue #599). Sol (the
  # flagship, same price as gpt-5.5) isn't added — not asked for; add the same way if wanted.
  # `cache_breakpoints: true` and `cache_write` are the two fields that make prompt caching work
  # on this family at all (#586, D195). GPT-5.6 changed the caching contract: it places one
  # implicit breakpoint at the latest user message and, per OpenAI's guide, "unlike earlier
  # models, it does not automatically fall back to the longest matching unmarked prefix before
  # that breakpoint" — so an unmarked request only ever hits on a byte-identical whole-prompt
  # repeat, which is why 440 archived luna calls produced not one partial prefix hit while
  # gpt-5.4-mini (earlier family, longest-prefix fallback) cached normally. Both fields belong to
  # the same family boundary, so both are set together on every GPT-5.6+ entry. `cache_write` is
